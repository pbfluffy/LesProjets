<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14211b">
<meta name="build" content="__BUILD_DATE__">
<meta name="description" content="A cozy idle fantasy RPG: lead a small party across wild lands and relight the watchtowers.">
<link rel="manifest" href="manifest.webmanifest?v=dev">
<link rel="icon" type="image/png" href="assets/pwa/icon-192.png?v=dev">
<link rel="apple-touch-icon" href="assets/pwa/apple-touch-icon.png?v=dev">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wildlight">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta property="og:type" content="website">
<meta property="og:title" content="Wildlight Expedition">
<meta property="og:description" content="Lead a small party across wild lands, beat the bosses and relight the watchtowers.">
<meta property="og:url" content="https://pumbafluffycorgi.com/wildlight-expedition/">
<meta property="og:image" content="https://pumbafluffycorgi.com/wildlight-expedition/assets/pwa/thumbnail.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>Wildlight Expedition</title>
<link rel="stylesheet" href="style.css?v=dev">
<link rel="preload" as="image" href="assets/map/map.jpg?v=dev">
</head>
<body>
<div id="app">
  <header class="top">
    <h1 class="brand"><span>Wildlight</span><small>Expedition</small></h1>
    <div class="purse">
      <button class="coin" data-act="resinfo" data-arg="gold" aria-label="Gold: tap to see what it is"><i class="ico gold"></i><b id="gold">0</b></button>
      <button class="coin" data-act="resinfo" data-arg="lumber" aria-label="Lumber: tap to see what it is"><i class="ico lumber"></i><b id="lumber">0</b></button>
    </div>
    <button class="acct" id="account-btn" data-act="account" aria-label="Account" disabled></button>
    <div class="acct-menu" id="acct-menu" hidden></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-arg="map">Map</button>
    <button data-act="tab" data-arg="party">Party</button>
    <button data-act="tab" data-arg="forge">Forge</button>
  </nav>
</div>

<section id="battle" hidden>
  <div class="battle-top">
    <div id="battle-title">Battle</div>
    <button class="ghost" data-act="retreat">Retreat</button>
  </div>
  <canvas id="stage" width="800" height="520"></canvas>
  <div id="warn" class="warn" aria-live="polite"></div>
  <button id="barrier" class="barrier" data-act="barrier">
    <span id="barrier-fill"></span>
    <span id="barrier-label">Raise barrier</span>
  </button>
  <div class="hint">Tap the barrier (or press Space) to block a heavy hit.</div>
  <div id="result" class="result" hidden></div>
</section>

<div id="toast" class="toast" hidden></div>
<div id="ver" class="ver" aria-hidden="true"></div>
<script src="art.js?v=dev"></script>
<script src="sprites.js?v=dev"></script>
<script src="game.js?v=dev"></script>
<script src="cloud.js?v=dev"></script>
<script src="pwa.js?v=dev"></script>
</body>
</html>
