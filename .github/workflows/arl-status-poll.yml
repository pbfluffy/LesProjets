name: Poll ARL status

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch ARL status and update file if changed
        id: poll
        run: node .github/scripts/poll-arl-status.js

      - name: Commit and push if changed
        if: steps.poll.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status-data/arl-status.json
          git commit -m "ARL status update [skip ci]"
          git push
