name: Card Perks scan

# Reads banks' official public card pages and publishes the privilege catalog
# (Firestore cardCatalog/{bankId}) that the Card Perks app reads. See
# card-perks/scanner. Weekly is plenty: card privileges change a few times a
# year. Run it by hand from the Actions tab after merging scanner changes.
#
# Needs the FIREBASE_SERVICE_ACCOUNT repo secret (the same one Cloudlingo's
# reminders use). Without it the job still scans and validates, it just can't
# publish, so a first run is a safe dry run.
on:
  schedule:
    - cron: '23 3 * * 1'   # Mondays 03:23 UTC, an off-peak minute
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Firestore (untick for a dry run that only scans and validates)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: card-perks-scan
  cancel-in-progress: false

jobs:
  # Each card's own privileges: ~15 pages, under a minute.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install scanner
        working-directory: card-perks/scanner
        run: npm install --no-audit --no-fund
      - name: Test parser
        working-directory: card-perks/scanner
        run: npm test
      - name: Scan and publish
        working-directory: card-perks/scanner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then node scan.mjs --publish; else node scan.mjs; fi

  # Dining promotions: ~1,900 pages at one request per second (about half an
  # hour), so its own job. A failure here never blocks the card scan above.
  promos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install scanner
        working-directory: card-perks/scanner
        run: npm install --no-audit --no-fund
      - name: Test parser
        working-directory: card-perks/scanner
        run: npm test
      - name: Scan and publish promotions
        working-directory: card-perks/scanner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then node scan.mjs --promos --publish; else node scan.mjs --promos; fi
