name: Price alerts check

# Stands in for a Cloudflare Cron Trigger, which would need the Workers
# Paid plan (Free caps Cron Trigger CPU at 10ms — not enough for this
# job). Plain GitHub Actions has no such cap, and this is a public repo
# so scheduled-workflow minutes are unlimited, so the check runs here
# instead — see stock-ranges/worker/scripts/check-alerts.mjs.
#
# Runs around the clock, every day — crypto trades 24/7, so a schedule
# limited to NYSE-ish hours would mean a BTC alert never fires on a
# weekend. The script's own getMarketStatus() check still gates stock/ETF
# pairs to real market hours; only crypto pairs get checked on every tick.
#
# Hourly is the intended cadence. GitHub's `schedule:` alone is best-effort
# and only ran ~5% of the requested 15-minute runs (median gap ~5h), so the
# stock-ranges Worker's Cron Trigger (stock-ranges/worker/src/trigger.js)
# starts this workflow every hour via workflow_dispatch; the schedule below is
# just a backup, at an off-peak minute (GitHub is busiest at :00).
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      test_push:
        description: 'Send a test notification to every registered device (through this job) instead of checking prices'
        type: boolean
        default: false
      cloudlingo_test:
        description: 'Diagnostic: send a test to every stored Cloudlingo reminder device through the reminder code, instead of the normal checks. path = the reminder contact (/cloudlingo/), site = the plain site URL. Leave off for normal runs.'
        type: choice
        options: ['off', path, site]
        default: 'off'
      cloudlingo_leagues:
        description: 'Cloudlingo leagues: dry = print the moves for the last finished week without saving anything (works any day). Leave off for normal runs.'
        type: choice
        options: ['off', dry]
        default: 'off'

# One run at a time: two overlapping runs (the Worker's trigger plus the backup
# schedule, or a manual test) would both read the saved state before either
# updated it, and could send the same alert twice. A waiting run is kept.
concurrency:
  group: price-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        working-directory: stock-ranges/worker
        run: npm install

      - name: Check alerts
        # Only the diagnostic values skip this: an unquoted YAML off used to arrive as something other than 'off',
        # which skipped the price check on every Worker-started run from 2026-11-18 to 2026-11-20.
        if: ${{ inputs.cloudlingo_test != 'path' && inputs.cloudlingo_test != 'site' }}
        working-directory: stock-ranges/worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_PUSH_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '' }}
        run: node scripts/check-alerts.mjs

      # Cloudlingo's evening study reminders ride on this reliable hourly job.
      # Isolated: it runs even if the price check failed, and its own failure
      # never fails this job. Idles until the FIREBASE_SERVICE_ACCOUNT secret exists.
      - name: Cloudlingo daily reminders
        if: ${{ always() && !inputs.test_push }}
        continue-on-error: true
        working-directory: cloudlingo/reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_PUSH_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          CLOUDLINGO_TEST: ${{ (inputs.cloudlingo_test == 'path' || inputs.cloudlingo_test == 'site') && inputs.cloudlingo_test || '' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "FIREBASE_SERVICE_ACCOUNT not set: skipping Cloudlingo reminders."; exit 0; fi
          npm install --no-audit --no-fund
          node send.mjs

      # Cloudlingo weekly leagues: does nothing except once a week, from Monday 12:00 UTC, when it ranks
      # last week's leaderboard and moves learners between leagues (see cloudlingo/reminders/leagues.mjs).
      # Isolated like the reminders: its failure never fails this job.
      - name: Cloudlingo weekly leagues
        if: ${{ always() && !inputs.test_push && inputs.cloudlingo_test != 'path' && inputs.cloudlingo_test != 'site' }}
        continue-on-error: true
        working-directory: cloudlingo/reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDLINGO_LEAGUES: ${{ inputs.cloudlingo_leagues == 'dry' && 'dry' || '' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "FIREBASE_SERVICE_ACCOUNT not set: skipping Cloudlingo leagues."; exit 0; fi
          [ -d node_modules ] || npm install --no-audit --no-fund
          node leagues.mjs
