name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build bill-splitter
        working-directory: bill-splitter
        run: |
          npm install
          npm run build

      - name: Build nutritions-thailand
        working-directory: nutritions-thailand
        run: |
          npm install
          npm run build

      - name: Build pumgoda
        working-directory: pumgoda
        run: |
          npm install
          npm run build

      - name: Build proteinratio
        working-directory: proteinratio
        run: |
          npm install
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/bill-splitter _site/nutritions-thailand _site/pumgoda _site/studio _site/proteinratio
          cp index.html _site/index.html
          cp admindepum.html _site/admindepum.html
          cp korea2026-d6718e8d.html _site/korea2026-d6718e8d.html
          cp temp.html _site/temp.html
          mkdir -p _site/backyard-rampage && cp -r backyard-rampage/. _site/backyard-rampage/
          cp -r studio/. _site/studio/
          cp -r bill-splitter/dist/. _site/bill-splitter/
          cp -r nutritions-thailand/dist/. _site/nutritions-thailand/
          cp -r pumgoda/dist/. _site/pumgoda/
          cp -r proteinratio/dist/. _site/proteinratio/
          cp pumba.png _site/pumba.png
          cp apple-touch-icon.png _site/apple-touch-icon.png
          cp icon-192.png _site/icon-192.png
          cp icon-512.png _site/icon-512.png
          cp icon-512-maskable.png _site/icon-512-maskable.png
          cp manifest.json _site/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
