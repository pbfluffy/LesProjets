name = "village-77"
main = "src/index.js"
compatibility_date = "2026-07-15"
workers_dev = true

# Shared post links on the site's own domain: pumbafluffycorgi.com/village-77/s/<id>.
# Only this path goes to the Worker; the rest of the site (GitHub Pages behind
# Cloudflare) is untouched. The app builds these links in ../src/share.js.
routes = [
  { pattern = "pumbafluffycorgi.com/village-77/s/*", zone_name = "pumbafluffycorgi.com" },
]

# Create with: npx wrangler r2 bucket create village-77-photos
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "village-77-photos"

[vars]
# LINE Login channel id — public (it appears in the login URL anyway).
# Must match LINE_CHANNEL_ID in ../src/config.js.
LINE_CHANNEL_ID = "2012133281"

# Secrets (never commit — set with `npx wrangler secret put <NAME>`):
#   LINE_CHANNEL_SECRET        LINE Login channel secret
#   FIREBASE_SERVICE_ACCOUNT   pumgoda service-account key (whole JSON file)

# Keep Worker logs (Cloudflare dashboard → Workers → village-77 → Logs), so
# failed LINE sign-ins can be traced after the fact.
[observability]
enabled = true
