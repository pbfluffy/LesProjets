name = "stock-ranges-quotes"
main = "src/index.js"
compatibility_date = "2026-07-15"
# nodejs_compat: @block65/webcrypto-web-push (test pushes, src/push.js) has a
# node:crypto fallback import; at runtime it uses globalThis.crypto.
compatibility_flags = ["nodejs_compat"]

# The app's own JS calls this worker directly via
# stock-ranges-quotes.pbfluffygaming.workers.dev — no zone route needed,
# unlike majon-photo/pumgoda (those rewrite og:* tags on the real app URL
# for link-preview crawlers; stock-ranges has no per-item share links).
workers_dev = true

# Vision extraction for the wallet's "Import from PDF" flow.
[ai]
binding = "AI"

# Per-IP rate limit on the (paid, AI-calling) POST import route.
[[kv_namespaces]]
binding = "IMPORT_RATE_LIMITER"
id = "c41511c9e6104ee8853565194dfec708"

# Price-alerts: per-user push subscriptions + alert config, plus a
# transition-detection cache keyed by symbol:range.
[[kv_namespaces]]
binding = "ALERTS"
id = "3a005aaf9deb41e48856476250ecf3f2"

# The price-alert check itself runs as a GitHub Actions workflow
# (worker/scripts/check-alerts.mjs) — too heavy for a Cron Trigger on the free
# tier (10ms CPU cap). GitHub's own schedule proved unreliable (about 5% of
# requested runs actually happen), so this hourly trigger just *starts* that
# workflow via GitHub's API (src/trigger.js): one HTTPS call, negligible CPU.
# Needs the secret GITHUB_DISPATCH_TOKEN (`wrangler secret put ...`).
[triggers]
crons = ["7 * * * *"]

[vars]
# Public by design — already embedded in the client bundle's Firebase
# config (src/firebase.js) — used to verify the `aud`/`iss` claims on a
# Firebase ID token in auth.js.
FIREBASE_PROJECT_ID = "pumgoda"
# VAPID public key is not secret (it's also shipped to the client as
# VITE_PUSH_VAPID_PUBLIC_KEY so the browser can pass it to
# pushManager.subscribe()) — private key is stored via `wrangler secret
# put VAPID_PRIVATE_KEY`, not here.
VAPID_PUBLIC_KEY = "BIMb5dO11tY3FjhLmRWXGWxAxwCTUTgfzTHYwDzxTbkvBTWfoOttCSOC0-ikoh-eJmvflWugbzPQtrLlI-aqtUs"
