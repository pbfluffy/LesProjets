name = "stock-ranges-quotes"
main = "src/index.js"
compatibility_date = "2026-07-15"
# @block65/webcrypto-web-push has a node:crypto fallback path (isomorphic
# crypto detection) that needs this even though the actual VAPID/push
# code it runs is pure Web Crypto — without it, wrangler warns the build
# may throw at runtime.
compatibility_flags = ["nodejs_compat"]

# The app's own JS calls this worker directly via
# stock-ranges-quotes.pbfluffygaming.workers.dev — no zone route needed,
# unlike majon-photo/pumgoda (those rewrite og:* tags on the real app URL
# for link-preview crawlers; stock-ranges has no per-item share links).
workers_dev = true

# Vision extraction for the wallet's "Import from PDF" flow.
[ai]
binding = "AI"

# Per-IP rate limit on the (paid, AI-calling) POST import route.
[[kv_namespaces]]
binding = "IMPORT_RATE_LIMITER"
id = "c41511c9e6104ee8853565194dfec708"

# Price-alerts: per-user push subscriptions + alert config, plus a
# transition-detection cache keyed by symbol:range. NOT YET CREATED — id
# below is a placeholder; run `wrangler kv namespace create ALERTS` and
# paste the real id here before this can deploy.
[[kv_namespaces]]
binding = "ALERTS"
id = "REPLACE_WITH_REAL_ALERTS_KV_NAMESPACE_ID"

# Cron Trigger for price-alert checks. Cron syntax can't express exact
# NYSE hours across a DST shift, so this window is deliberately loose
# (covers both EST and EDT) — getMarketStatus() inside scheduled() does
# the precise gating, this just bounds how often the Worker wakes up at
# all. NOTE: Cron Triggers get only 10ms CPU on the Workers Free plan —
# this account needs to be on Workers Paid for the handler to run to
# completion.
[triggers]
crons = ["*/15 9-21 * * 1-5"]

[vars]
# Public by design — already embedded in the client bundle's Firebase
# config (src/firebase.js) — used to verify the `aud`/`iss` claims on a
# Firebase ID token in auth.js.
FIREBASE_PROJECT_ID = "pumgoda"
# VAPID public key is not secret (it's also shipped to the client as
# VITE_PUSH_VAPID_PUBLIC_KEY so the browser can pass it to
# pushManager.subscribe()) — only the private key needs `wrangler secret
# put VAPID_PRIVATE_KEY`. NOT YET GENERATED — placeholder below.
VAPID_PUBLIC_KEY = "REPLACE_WITH_REAL_VAPID_PUBLIC_KEY"
