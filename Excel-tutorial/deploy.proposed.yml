# PROPOSED workflow update — review before replacing .github/workflows/deploy.yml
#
# Diff vs current deploy.yml: adds a second `npm install && npm run build` step
# for excel-tutorial, and copies excel-tutorial/dist/ into _site/excel-tutorial/.
# The existing excel-tutorial.html copy is left in place as a static fallback;
# the new app lives at /excel-tutorial/ (with trailing slash, no .html), so they
# do not collide. Once you're confident the new app is good, you can drop the
# excel-tutorial.html copy line.
#
# To apply: replace .github/workflows/deploy.yml with the contents below.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build bill-splitter
        working-directory: bill-splitter
        run: |
          npm install
          npm run build

      - name: Build excel-tutorial
        working-directory: excel-tutorial
        run: |
          npm install
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/bill-splitter
          mkdir -p _site/excel-tutorial
          cp index.html _site/index.html
          cp NutritionsInThailand.html _site/NutritionsInThailand.html
          cp excel-tutorial.html _site/excel-tutorial.html
          cp -r bill-splitter/dist/. _site/bill-splitter/
          cp -r excel-tutorial/dist/. _site/excel-tutorial/
          cp pumba.png _site/pumba.png
          cp apple-touch-icon.png _site/apple-touch-icon.png
          cp icon-192.png _site/icon-192.png
          cp icon-512.png _site/icon-512.png
          cp manifest.json _site/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
