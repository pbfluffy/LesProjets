<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ลดไขมัน · รักษากล้ามเนื้อ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    :root {
      --bg: #080810; --bg2: #13131E; --bg3: #1A1A2A;
      --border: #2A2A3A; --text: #F0EEE8; --muted: #888; --subtle: #555;
      --accent: #FF6B35; --green: #06D6A0; --blue: #4FC3F7;
      --yellow: #FFD166; --red: #EF476F;
      --card-bg: #13131E; --input-bg: #1A1A2A;
    }
    [data-theme="light"] {
      --bg: #F5F5F0; --bg2: #FFFFFF; --bg3: #EBEBEB;
      --border: #DDDDDD; --text: #1A1A2A; --muted: #666; --subtle: #AAA;
      --card-bg: #FFFFFF; --input-bg: #F0F0F0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    .app { max-width: 600px; margin: 0 auto; padding: 0 0 80px; }

    /* HEADER */
    .header { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
    .header-controls { display: flex; gap: 8px; }
    .icon-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 14px; cursor: pointer; transition: opacity .2s; }
    .icon-btn:hover { opacity: .7; }

    /* TABS */
    .tab-bar { display: flex; gap: 6px; padding: 12px 16px 0; }
    .tab-btn { flex: 1; padding: 8px 4px; border: 1px solid var(--border); background: var(--bg2); color: var(--muted); border-radius: 10px; font-size: 12px; cursor: pointer; transition: all .2s; font-weight: 500; }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* CARDS */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin: 12px 16px 0; }
    .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 16px 0; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .stat-label { font-size: 9px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 900; line-height: 1; }
    .stat-unit { font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* PROGRESS */
    .progress-bar { background: var(--bg3); border-radius: 6px; height: 10px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; border-radius: 6px; transition: width .4s ease; }

    /* SEARCH */
    .search-wrap { padding: 12px 16px 0; }
    .search-input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 14px; outline: none; transition: border-color .2s; }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--subtle); }

    /* FILTER CHIPS */
    .filter-chips { display: flex; gap: 6px; padding: 10px 16px 0; overflow-x: auto; scrollbar-width: none; }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg2); color: var(--muted); font-size: 12px; cursor: pointer; transition: all .2s; flex-shrink: 0; }
    .chip.active { border-color: var(--accent); color: var(--accent); background: rgba(255,107,53,.12); }

    /* FOOD ITEMS */
    .category-header { padding: 14px 16px 6px; display: flex; align-items: center; gap: 8px; }
    .category-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .category-name { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; color: var(--muted); }
    .food-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background .15s; border-radius: 0; }
    .food-item:hover { background: var(--bg3); }
    .food-info { flex: 1; min-width: 0; }
    .food-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .food-macros { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: monospace; }
    .food-note { font-size: 11px; color: var(--subtle); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .food-kcal { font-size: 15px; font-weight: 700; color: var(--accent); font-family: monospace; flex-shrink: 0; }
    .food-added { background: rgba(6,214,160,.15) !important; }

    /* MACROS ROW */
    .macro-row { display: flex; gap: 8px; margin-top: 10px; }
    .macro-pill { flex: 1; background: var(--bg3); border-radius: 8px; padding: 8px; text-align: center; }
    .macro-pill-val { font-size: 14px; font-weight: 700; font-family: monospace; }
    .macro-pill-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 2px; }

    /* CUSTOM FOOD */
    .custom-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .custom-form .full-width { grid-column: 1 / -1; }
    .form-input { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; width: 100%; outline: none; }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--subtle); }
    .btn { padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity .2s; }
    .btn:hover { opacity: .8; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; margin-top: 8px; }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
    .btn-danger { background: rgba(239,71,111,.15); color: var(--red); border: 1px solid rgba(239,71,111,.3); }
    .btn-green { background: rgba(6,214,160,.15); color: var(--green); border: 1px solid rgba(6,214,160,.3); }

    /* SLIDER */
    .slider-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; width: 100%; outline: none; }

    /* LOG */
    .log-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .log-item:last-child { border-bottom: none; }
    .log-name { font-size: 13px; }
    .log-kcal { font-size: 13px; font-weight: 700; color: var(--accent); font-family: monospace; }
    .empty-state { text-align: center; padding: 32px 16px; color: var(--muted); font-size: 13px; }

    /* SECTION TITLE */
    .section-title { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; font-weight: 700; }

    /* WATER */
    .water-grid { display: flex; gap: 6px; flex-wrap: wrap; }
    .water-drop { font-size: 22px; cursor: pointer; opacity: .3; transition: all .2s; }
    .water-drop.filled { opacity: 1; }

    @media (max-width: 400px) {
      .card-row { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stat-value { font-size: 18px; }
      .food-name { font-size: 13px; }
    }
  </style>
</head>
<body>
<a href="./" title="Home" style="position:fixed;top:14px;left:14px;z-index:99999;display:inline-flex;align-items:center;gap:6px;background:rgba(20,20,20,.78);color:#fff;text-decoration:none;padding:8px 14px;border-radius:999px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);transition:transform .15s" onmouseover="this.style.transform=&quot;scale(1.05)&quot;" onmouseout="this.style.transform=&quot;scale(1)&quot;">&larr; Home</a>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback } = React;

const MEALS = [
  {
    category: "🌅 มื้อเช้า", color: "#FF6B35", id: "morning",
    items: [
      { name: "ไข่ต้ม 2 ฟอง", kcal: 140, protein: 12, fat: 10, carbs: 0, note: "โปรตีนดี ไขมันดี" },
      { name: "ไข่ดาว 2 ฟอง + ข้าว", kcal: 380, protein: 14, fat: 14, carbs: 45, note: "หาง่ายทุกที่" },
      { name: "ไข่เจียวหมูสับ + ข้าว", kcal: 450, protein: 20, fat: 18, carbs: 42, note: "อิ่มนาน" },
      { name: "โจ๊กไก่ (ชามเล็ก)", kcal: 210, protein: 14, fat: 4, carbs: 28, note: "ย่อยง่าย โปรตีนดี" },
      { name: "โจ๊กหมู (ชามเล็ก)", kcal: 220, protein: 13, fat: 5, carbs: 27, note: "ย่อยง่าย" },
      { name: "ข้าวต้มปลา", kcal: 230, protein: 16, fat: 4, carbs: 30, note: "โปรตีนดี แคลต่ำ" },
      { name: "ข้าวไข่พะโล้", kcal: 420, protein: 18, fat: 12, carbs: 52, note: "หวานนิดหน่อย" },
      { name: "นมจืด 250ml", kcal: 150, protein: 8, fat: 8, carbs: 12, note: "เพิ่มโปรตีนได้ง่าย" },
      { name: "โยเกิร์ตกรีก 150g", kcal: 130, protein: 15, fat: 3, carbs: 7, note: "โปรตีนสูง คลีน 🌟" },
      { name: "ขนมปังโฮลวีต + ไข่ต้ม 2 ฟอง", kcal: 310, protein: 18, fat: 10, carbs: 34, note: "อาหารเช้าคลีน" },
    ],
  },
  {
    category: "☀️ มื้อกลางวัน", color: "#06D6A0", id: "lunch",
    items: [
      { name: "ข้าวหน้าไก่ย่าง", kcal: 480, protein: 35, fat: 10, carbs: 52, note: "โปรตีนสูง ✅" },
      { name: "ข้าวมันไก่ (ไม่เอาหนัง)", kcal: 420, protein: 30, fat: 8, carbs: 48, note: "ตัดหนังออก ไขมันลด" },
      { name: "ส้มตำ + ไก่ย่าง", kcal: 350, protein: 32, fat: 8, carbs: 22, note: "คลีนมาก 🌟" },
      { name: "ข้าวหมูแดง (ไม่เอามันกรอบ)", kcal: 460, protein: 28, fat: 12, carbs: 50, note: "ขอไม่เอามันกรอบ" },
      { name: "ข้าวราดแกงเขียวหวานไก่", kcal: 520, protein: 28, fat: 18, carbs: 55, note: "ระวังกะทิ" },
      { name: "ก๋วยเตี๋ยวไก่น้ำใส", kcal: 320, protein: 22, fat: 5, carbs: 42, note: "แคลต่ำ โปรตีนพอใช้" },
      { name: "ก๋วยเตี๋ยวหมูตก", kcal: 380, protein: 24, fat: 10, carbs: 44, note: "ระวังน้ำมัน" },
      { name: "ข้าวกะเพราไก่น้ำดาว", kcal: 550, protein: 32, fat: 16, carbs: 52, note: "โปรตีนดี แต่แคลสูง" },
      { name: "ข้าวราดมังกุระเทียม", kcal: 490, protein: 30, fat: 14, carbs: 48, note: "โปรตีนดี" },
      { name: "สลัดไก่ย่าง (ไม่ราดน้ำสลัด)", kcal: 250, protein: 28, fat: 6, carbs: 12, note: "คลีนสุด 🌟" },
      { name: "ข้าวหน้าปลานึ่งซอสมะนาวย่าง", kcal: 500, protein: 34, fat: 14, carbs: 50, note: "โอเมก้า 3 ดี" },
      { name: "ข้าวราดเต้าหู้ผัดผัก", kcal: 380, protein: 18, fat: 10, carbs: 45, note: "มังสวิรัติ โปรตีนพอใช้" },
    ],
  },
  {
    category: "🌙 มื้อเย็น", color: "#4FC3F7", id: "dinner",
    items: [
      { name: "ไข่ขาวต้ม 3 ฟอง", kcal: 50, protein: 11, fat: 0, carbs: 1, note: "โปรตีนล้วน" },
      { name: "กล้วย 1 ผล", kcal: 90, protein: 1, fat: 0, carbs: 23, note: "คาร์บก่อนออกกำลัง" },
      { name: "นมไข่ขาว (egg white)", kcal: 60, protein: 13, fat: 0, carbs: 1, note: "โปรตีนเกือบ 100%" },
      { name: "ลูกชิ้นปลาต้ม 5 ลูก", kcal: 100, protein: 10, fat: 3, carbs: 5, note: "หาง่าย ราคาถูก" },
      { name: "ปลาหมึกย่าง (ตัวเล็ก)", kcal: 120, protein: 16, fat: 2, carbs: 4, note: "โปรตีนสูง ไขมันต่ำ" },
      { name: "เต้าหู้ขาวนึ่ง 100g", kcal: 70, protein: 8, fat: 4, carbs: 2, note: "โปรตีนพืช ราคาถูก" },
      { name: "นมโปรตีนสูง (Hi-Pro)", kcal: 160, protein: 18, fat: 5, carbs: 10, note: "หาได้ตาม 7-11" },
    ],
  },
  {
    category: "🏪 ร้านสะดวกซื้อ (7-11)", color: "#EF476F", id: "seven",
    items: [
      { name: "ไข่ต้ม 7-11 (2 ฟอง)", kcal: 140, protein: 12, fat: 10, carbs: 0, note: "สะดวก ราคาถูก 🌟" },
      { name: "อกไก่ 7-11", kcal: 120, protein: 22, fat: 3, carbs: 2, note: "โปรตีนสูงมาก 🌟" },
      { name: "ทูน่ากระป๋องในน้ำ", kcal: 100, protein: 22, fat: 1, carbs: 0, note: "โปรตีนสูง แคลต่ำ 🌟" },
      { name: "ข้าวกล่อง 7-11", kcal: 280, protein: 6, fat: 2, carbs: 58, note: "คาร์บดี ไฟเบอร์สูง" },
      { name: "สลัดผักรวม 7-11", kcal: 80, protein: 3, fat: 2, carbs: 12, note: "เพิ่มผักได้ง่าย" },
      { name: "นมถั่วเหลืองไม่หวาน", kcal: 100, protein: 7, fat: 4, carbs: 8, note: "โปรตีนพืช" },
      { name: "โปรตีนบาร์ (ยี่ห้อทั่วไป)", kcal: 200, protein: 20, fat: 7, carbs: 15, note: "ของว่างฉุกเฉิน" },
      { name: "ลูกชิ้นเสียบไม้ต้ม (5 ไม้)", kcal: 150, protein: 12, fat: 5, carbs: 10, note: "หน้าร้าน สะดวก" },
    ],
  },
];

function calcBMR(w, h, a, g) {
  return g === "male" ? 10*w + 6.25*h - 5*a + 5 : 10*w + 6.25*h - 5*a - 161;
}
const ACTIVITY = [
  { k: "sedentary", label: "นั่งทำงาน", mult: 1.2 },
  { k: "light", label: "ออกกำลัง 1-3วัน/อาทิตย์", mult: 1.375 },
  { k: "moderate", label: "ออกกำลัง 3-5วัน/อาทิตย์", mult: 1.55 },
  { k: "active", label: "ออกกำลัง 6-7วัน/อาทิตย์", mult: 1.725 },
];
const BMI_INFO = [
  { max: 18.5, text: "น้ำหนักน้อย", color: "#4FC3F7" },
  { max: 23, text: "ปกติ", color: "#06D6A0" },
  { max: 25, text: "น้ำหนักเกิน", color: "#FFD166" },
  { max: 30, text: "อ้วน", color: "#EF476F" },
  { max: 999, text: "อ้วนมาก", color: "#C41E3A" },
];
function getBMI(bmi) { return BMI_INFO.find(b => bmi < b.max) || BMI_INFO[BMI_INFO.length-1]; }

function App() {
  const [theme, setTheme] = useState("dark");
  const [tab, setTab] = useState("overview");
  const [search, setSearch] = useState("");
  const [filterCat, setFilterCat] = useState("all");

  // Stats
  const [stats, setStats] = useState({ weight: 75, height: 170, age: 25, gender: "male", activity: "moderate", deficit: 400 });
  const updateStat = (k, v) => setStats(s => ({ ...s, [k]: v }));

  // Log
  const [log, setLog] = useState([]);
  const addToLog = useCallback(item => {
    setLog(l => [...l, { ...item, id: Date.now() + Math.random() }]);
  }, []);
  const removeFromLog = useCallback(id => setLog(l => l.filter(x => x.id !== id)), []);

  // Custom foods
  const [customFoods, setCustomFoods] = useState([]);
  const [customForm, setCustomForm] = useState({ name: "", kcal: "", protein: "", fat: "", carbs: "", note: "" });

  // Water
  const [water, setWater] = useState(0);

  // Toggle theme
  const toggleTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    setTheme(next);
    document.documentElement.setAttribute("data-theme", next);
  };

  const bmr = calcBMR(stats.weight, stats.height, stats.age, stats.gender);
  const act = ACTIVITY.find(a => a.k === stats.activity);
  const tdee = Math.round(bmr * act.mult);
  const targetCals = tdee - stats.deficit;
  const bmi = stats.weight / ((stats.height/100) ** 2);
  const bmiInfo = getBMI(bmi);
  const leanMass = Math.round(stats.weight * (1 - (bmi > 25 ? 0.22 : bmi > 23 ? 0.17 : 0.13)));
  const estBF = bmi > 25 ? 22 : bmi > 23 ? 17 : 13;

  const totalCalEaten = log.reduce((s, x) => s + (x.kcal || 0), 0);
  const totalProtein = log.reduce((s, x) => s + (x.protein || 0), 0);
  const totalFat = log.reduce((s, x) => s + (x.fat || 0), 0);
  const totalCarbs = log.reduce((s, x) => s + (x.carbs || 0), 0);

  // All foods including custom
  const allFoods = useMemo(() => {
    const cats = [...MEALS];
    if (customFoods.length > 0) cats.push({ category: "⭐ ของฉัน", color: "#FFD166", id: "custom", items: customFoods });
    return cats;
  }, [customFoods]);

  // Filtered foods
  const filteredFoods = useMemo(() => {
    return allFoods.map(cat => ({
      ...cat,
      items: cat.items.filter(item => {
        const matchSearch = !search || item.name.toLowerCase().includes(search.toLowerCase());
        const matchCat = filterCat === "all" || cat.id === filterCat;
        return matchSearch && matchCat;
      })
    })).filter(cat => cat.items.length > 0);
  }, [allFoods, search, filterCat]);

  const addCustomFood = () => {
    if (!customForm.name || !customForm.kcal) return;
    setCustomFoods(f => [...f, {
      name: customForm.name,
      kcal: Number(customForm.kcal), protein: Number(customForm.protein||0),
      fat: Number(customForm.fat||0), carbs: Number(customForm.carbs||0),
      note: customForm.note || "อาหารของฉัน"
    }]);
    setCustomForm({ name: "", kcal: "", protein: "", fat: "", carbs: "", note: "" });
  };

  const pct = Math.min(100, (totalCalEaten / targetCals) * 100);
  const progColor = totalCalEaten > targetCals ? "var(--red)" : totalCalEaten > targetCals * 0.9 ? "var(--yellow)" : "var(--green)";

  return (
    <div className="app">
      {/* Header */}
      <div className="header">
        <span className="header-title">🔥 ลดไขมัน · รักษากล้ามเนื้อ</span>
        <div className="header-controls">
          <button className="icon-btn" onClick={() => { window.location.href = './' }} title="กลับสู่หน้าแรก" aria-label="Home">🏠</button>
          <button className="icon-btn" onClick={toggleTheme}>{theme === "dark" ? "🌞" : "🌙"}</button>
          <button className="icon-btn" onClick={() => { setLog([]); setWater(0); }}>↺</button>
        </div>
      </div>

      {/* Tabs */}
      <div className="tab-bar">
        {[["overview","📊 ภาพรวม"],["food","🍱 อาหาร"],["adjust","⚙️ ปรับค่า"],["custom","➕ เพิ่มเอง"]].map(([k,l]) => (
          <button key={k} className={`tab-btn ${tab===k?"active":""}`} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>

      {/* OVERVIEW TAB */}
      {tab === "overview" && <>
        {/* Stat cards */}
        <div className="card-row">
          {[
            { label: "TDEE", value: tdee, unit: "kcal/วัน", color: "var(--yellow)" },
            { label: "เป้าหมาย", value: targetCals, unit: "kcal/วัน", color: "var(--accent)" },
            { label: "BMI", value: bmi.toFixed(1), unit: bmiInfo.text, color: bmiInfo.color },
            { label: "กล้ามเนื้อ", value: `${leanMass}kg`, unit: `ไขมัน ~${estBF}%`, color: "var(--green)" },
          ].map((c,i) => (
            <div className="stat-card" key={i} style={{ borderTop: `3px solid ${c.color}` }}>
              <div className="stat-label">{c.label}</div>
              <div className="stat-value" style={{ color: c.color }}>{c.value}</div>
              <div className="stat-unit">{c.unit}</div>
            </div>
          ))}
        </div>

        {/* Calorie progress */}
        <div className="card">
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
            <span style={{ fontSize:12, color:"var(--muted)", fontFamily:"monospace" }}>🔥 แคลอรี่วันนี้</span>
            <span style={{ fontSize:12, fontFamily:"monospace" }}>
              <span style={{ color: progColor, fontWeight:700 }}>{totalCalEaten}</span>
              <span style={{ color:"var(--muted)" }}> / {targetCals} kcal</span>
            </span>
          </div>
          <div className="progress-bar">
            <div className="progress-fill" style={{ width:`${pct}%`, background: progColor }} />
          </div>
          <div style={{ fontSize:11, color:"var(--muted)", textAlign:"right", marginTop:4 }}>
            {totalCalEaten > targetCals
              ? `⚠️ เกิน ${totalCalEaten - targetCals} kcal`
              : `✅ เหลือ ${targetCals - totalCalEaten} kcal`}
          </div>

          {/* Macros */}
          <div className="macro-row">
            {[
              { label:"โปรตีน", val: totalProtein, unit:"g", color:"var(--green)" },
              { label:"ไขมัน", val: totalFat, unit:"g", color:"var(--yellow)" },
              { label:"คาร์บ", val: totalCarbs, unit:"g", color:"var(--blue)" },
            ].map(m => (
              <div className="macro-pill" key={m.label}>
                <div className="macro-pill-val" style={{ color: m.color }}>{m.val}{m.unit}</div>
                <div className="macro-pill-label">{m.label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Water tracker */}
        <div className="card">
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <span style={{ fontSize:13, fontWeight:600 }}>💧 น้ำวันนี้</span>
            <span style={{ fontSize:12, color:"var(--blue)", fontFamily:"monospace" }}>{water * 250}ml / 2000ml</span>
          </div>
          <div className="water-grid">
            {Array.from({ length: 8 }).map((_, i) => (
              <span key={i} className={`water-drop ${i < water ? "filled" : ""}`}
                onClick={() => setWater(i < water ? i : i + 1)}>💧</span>
            ))}
          </div>
        </div>

        {/* Food log */}
        <div className="card">
          <div className="section-title">บันทึกอาหารวันนี้</div>
          {log.length === 0 ? (
            <div className="empty-state">ยังไม่มีอาหาร — เลือกจากแท็บ 🍱 อาหาร</div>
          ) : log.map(item => (
            <div className="log-item" key={item.id}>
              <div>
                <div className="log-name">{item.name}</div>
                <div style={{ fontSize:11, color:"var(--muted)", fontFamily:"monospace" }}>
                  P:{item.protein}g F:{item.fat}g C:{item.carbs}g
                </div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <span className="log-kcal">{item.kcal}</span>
                <button className="btn btn-sm btn-danger" onClick={() => removeFromLog(item.id)}>✕</button>
              </div>
            </div>
          ))}
        </div>
      </>}

      {/* FOOD TAB */}
      {tab === "food" && <>
        <div className="search-wrap">
          <input className="search-input" placeholder="🔍 ค้นหาอาหาร..." value={search}
            onChange={e => setSearch(e.target.value)} />
        </div>
        <div className="filter-chips">
          <div className={`chip ${filterCat==="all"?"active":""}`} onClick={() => setFilterCat("all")}>ทั้งหมด</div>
          {MEALS.map(m => (
            <div key={m.id} className={`chip ${filterCat===m.id?"active":""}`}
              onClick={() => setFilterCat(m.id)}>{m.category}</div>
          ))}
          {customFoods.length > 0 && (
            <div className={`chip ${filterCat==="custom"?"active":""}`} onClick={() => setFilterCat("custom")}>⭐ ของฉัน</div>
          )}
        </div>

        {filteredFoods.length === 0 && (
          <div className="empty-state">ไม่พบอาหารที่ค้นหา</div>
        )}

        {filteredFoods.map(cat => (
          <div key={cat.id}>
            <div className="category-header">
              <div className="category-dot" style={{ background: cat.color }} />
              <span className="category-name">{cat.category}</span>
            </div>
            {cat.items.map((item, i) => {
              const isAdded = log.some(x => x.name === item.name);
              return (
                <div key={i} className={`food-item ${isAdded?"food-added":""}`} onClick={() => addToLog(item)}>
                  <div className="food-info">
                    <div className="food-name">{item.name}</div>
                    <div className="food-macros">P:{item.protein}g · F:{item.fat}g · C:{item.carbs}g</div>
                    {item.note && <div className="food-note">{item.note}</div>}
                  </div>
                  <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4 }}>
                    <span className="food-kcal">{item.kcal}</span>
                    <span style={{ fontSize:9, color:"var(--muted)", fontFamily:"monospace" }}>kcal</span>
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </>}

      {/* ADJUST TAB */}
      {tab === "adjust" && <>
        <div className="card">
          <div className="section-title">ข้อมูลร่างกาย</div>
          {[
            { label: `น้ำหนัก: ${stats.weight} kg`, key: "weight", min: 40, max: 150, step: 0.5 },
            { label: `ส่วนสูง: ${stats.height} cm`, key: "height", min: 140, max: 210, step: 1 },
            { label: `อายุ: ${stats.age} ปี`, key: "age", min: 15, max: 80, step: 1 },
          ].map(s => (
            <div key={s.key} style={{ marginBottom: 16 }}>
              <div className="slider-label"><span>{s.label}</span></div>
              <input type="range" min={s.min} max={s.max} step={s.step} value={stats[s.key]}
                onChange={e => updateStat(s.key, Number(e.target.value))} />
            </div>
          ))}
          <div style={{ display:"flex", gap:8, marginBottom:16 }}>
            {[["male","♂ ชาย"],["female","♀ หญิง"]].map(([v,l]) => (
              <button key={v} className="btn" style={{ flex:1,
                background: stats.gender===v ? "var(--accent)" : "var(--bg3)",
                color: stats.gender===v ? "#fff" : "var(--muted)",
                border: `1px solid ${stats.gender===v ? "var(--accent)" : "var(--border)"}` }}
                onClick={() => updateStat("gender", v)}>{l}</button>
            ))}
          </div>
          <select value={stats.activity} onChange={e => updateStat("activity", e.target.value)}>
            {ACTIVITY.map(a => <option key={a.k} value={a.k}>{a.label} (×{a.mult})</option>)}
          </select>
        </div>

        <div className="card" style={{ marginTop: 12 }}>
          <div className="section-title">เป้าหมาย Deficit</div>
          <div className="slider-label">
            <span>ลดแคลอรี่: <strong style={{ color:"var(--accent)" }}>{stats.deficit} kcal/วัน</strong></span>
            <span style={{ color:"var(--muted)", fontSize:11 }}>~{Math.round(stats.deficit*7/7700*10)/10} kg/อาทิตย์</span>
          </div>
          <input type="range" min={0} max={800} step={50} value={stats.deficit}
            onChange={e => updateStat("deficit", Number(e.target.value))} />
          <div style={{ display:"flex", gap:8, marginTop:12 }}>
            {[[0,"維持"],[300,"ลดน้อย"],[400,"ลดปานกลาง"],[600,"ลดเร็ว"]].map(([v,l]) => (
              <button key={v} className="btn btn-sm" style={{ flex:1, fontSize:10,
                background: stats.deficit===v ? "rgba(255,107,53,.2)" : "var(--bg3)",
                color: stats.deficit===v ? "var(--accent)" : "var(--muted)",
                border: `1px solid ${stats.deficit===v ? "var(--accent)" : "var(--border)"}` }}
                onClick={() => updateStat("deficit", v)}>{l}</button>
            ))}
          </div>
        </div>
      </>}

      {/* CUSTOM FOOD TAB */}
      {tab === "custom" && <>
        <div className="card">
          <div className="section-title">เพิ่มอาหารของฉัน</div>
          <div className="custom-form">
            <input className={`form-input full-width`} placeholder="ชื่ออาหาร *" value={customForm.name}
              onChange={e => setCustomForm(f=>({...f,name:e.target.value}))} />
            <input className="form-input" placeholder="แคลอรี่ (kcal) *" type="number" value={customForm.kcal}
              onChange={e => setCustomForm(f=>({...f,kcal:e.target.value}))} />
            <input className="form-input" placeholder="โปรตีน (g)" type="number" value={customForm.protein}
              onChange={e => setCustomForm(f=>({...f,protein:e.target.value}))} />
            <input className="form-input" placeholder="ไขมัน (g)" type="number" value={customForm.fat}
              onChange={e => setCustomForm(f=>({...f,fat:e.target.value}))} />
            <input className="form-input" placeholder="คาร์บ (g)" type="number" value={customForm.carbs}
              onChange={e => setCustomForm(f=>({...f,carbs:e.target.value}))} />
            <input className="form-input" placeholder="หมายเหตุ" value={customForm.note}
              onChange={e => setCustomForm(f=>({...f,note:e.target.value}))} />
          </div>
          <button className="btn btn-primary" onClick={addCustomFood}>+ เพิ่มอาหาร</button>
        </div>

        {customFoods.length > 0 && (
          <div className="card" style={{ marginTop: 12 }}>
            <div className="section-title">อาหารของฉัน ({customFoods.length} รายการ)</div>
            {customFoods.map((item, i) => (
              <div className="log-item" key={i}>
                <div>
                  <div className="log-name">{item.name}</div>
                  <div style={{ fontSize:11, color:"var(--muted)", fontFamily:"monospace" }}>
                    {item.kcal}kcal · P:{item.protein}g · F:{item.fat}g · C:{item.carbs}g
                  </div>
                </div>
                <div style={{ display:"flex", gap:6 }}>
                  <button className="btn btn-sm btn-green" onClick={() => addToLog(item)}>+ บันทึก</button>
                  <button className="btn btn-sm btn-danger" onClick={() => setCustomFoods(f => f.filter((_,j)=>j!==i))}>✕</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
