<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pum’s Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0:#0a0c12; --bg-1:#12161f; --bg-2:#1a1f2b; --line:#252c3a; --line-bright:#36404f;
    --corgi:#ffae42; --floof:#8fe388; --text:#eef2e9; --text-mid:#9aa890; --text-dim:#5a6655;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg-0); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:14px; min-height:100vh; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 70% 50% at 25% 10%, rgba(255,174,66,0.05), transparent 60%),radial-gradient(ellipse 70% 50% at 75% 90%, rgba(143,227,136,0.05), transparent 60%); pointer-events:none; z-index:0; }
  .app { position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:24px 16px 36px; }
  .hero { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:20px; flex-wrap:wrap; gap:14px; }
  .hero-title { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(22px,5vw,38px); letter-spacing:-0.01em; line-height:1; background:linear-gradient(120deg,var(--corgi),var(--floof)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-sub { font-size:10px; color:var(--text-dim); letter-spacing:0.28em; text-transform:uppercase; margin-top:7px; }
  .hero-sub .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--floof); box-shadow:0 0 8px var(--floof); margin-right:6px; animation:pulse 2s ease-in-out infinite; }
  .hero-clock { font-family:'Press Start 2P',monospace; font-size:14px; color:var(--floof); text-shadow:0 0 10px rgba(143,227,136,0.4); text-align:right; }
  .hero-date { font-size:9px; color:var(--text-dim); letter-spacing:0.2em; text-align:right; margin-top:6px; }
  .grid { display:grid; grid-template-columns:1fr 270px; gap:16px; }
  @media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
  .stage-wrap { background:linear-gradient(180deg,var(--bg-1),var(--bg-2)); border:1px solid var(--line); padding:12px; }
  .stage-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .stage-title { font-family:'Syne',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.25em; text-transform:uppercase; }
  .stage-meta { font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-dim); }
  .stage { position:relative; width:100%; aspect-ratio:1402 / 1122; background:#0a0c12; border:1px solid var(--line); overflow:hidden; }
  .stage-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  /* day/night wash over the window */
  .window-fx { position:absolute; mix-blend-mode:multiply; pointer-events:none; }
  .window-fx.run { animation:daynight 48s ease-in-out infinite; }
  @keyframes daynight {
    0%   { background:rgba(40,30,80,0); }
    22%  { background:rgba(8,10,34,0.62); }
    42%  { background:rgba(14,14,46,0.5); }
    66%  { background:rgba(60,42,72,0.32); }
    82%  { background:rgba(150,96,66,0.22); }
    100% { background:rgba(40,30,80,0); }
  }
  /* warm dawn screen layer over window */
  .window-warm { position:absolute; mix-blend-mode:screen; pointer-events:none; background:rgba(255,170,90,0); }
  .window-warm.run { animation:dawnwarm 48s ease-in-out infinite; }
  @keyframes dawnwarm { 0%,70%,100%{ background:rgba(255,170,90,0);} 82%{ background:rgba(255,170,90,0.18);} }

  /* lamp glow */
  .lamp { position:absolute; border-radius:50%; transform:translate(-50%,-50%); mix-blend-mode:screen; pointer-events:none; background:radial-gradient(circle, rgba(255,214,140,0.9), rgba(255,190,100,0.25) 45%, transparent 70%); }
  .lamp.run { animation:lampPulse 4.5s ease-in-out infinite; }
  @keyframes lampPulse { 0%,100%{ opacity:.55; transform:translate(-50%,-50%) scale(1); } 50%{ opacity:.8; transform:translate(-50%,-50%) scale(1.06); } }

  /* screen-activity glow (screens face away; this is the light they cast) */
  .screen { position:absolute; border-radius:40%; transform:translate(-50%,-50%); mix-blend-mode:screen; pointer-events:none; }
  .screen.run { animation:screenFlick 0.9s steps(8,end) infinite; }
  @keyframes screenFlick { 0%{opacity:.18} 20%{opacity:.30} 35%{opacity:.16} 55%{opacity:.34} 70%{opacity:.20} 90%{opacity:.28} 100%{opacity:.22} }

  /* dog overlays */
  .dog { position:absolute; transform-origin:50% 100%; will-change:transform; }
  .dog img { display:block; width:100%; height:auto; }
  .dog.breathe { animation:breathe 3.8s ease-in-out infinite; }
  .dog.type { animation:typing 0.5s ease-in-out infinite; }
  .dog.tilt { animation:tilt 1.3s ease-in-out; }
  .dog.perk { animation:perk 0.6s ease-out; }
  @keyframes breathe { 0%,100%{ transform:scaleY(1) } 50%{ transform:scaleY(1.016) } }
  @keyframes typing { 0%,100%{ transform:scaleY(1) rotate(0) } 30%{ transform:scaleY(1.012) rotate(-0.5deg) } 70%{ transform:scaleY(1.006) rotate(0.5deg) } }
  @keyframes tilt { 0%{ transform:rotate(0) } 35%{ transform:rotate(4deg) } 70%{ transform:rotate(4deg) } 100%{ transform:rotate(0) } }
  @keyframes perk { 0%{ transform:scaleY(1) } 40%{ transform:scaleY(1.05) } 100%{ transform:scaleY(1) } }

  /* monitor-glow cast on each dog */
  .glow { position:absolute; border-radius:50%; mix-blend-mode:screen; pointer-events:none; }
  .glow.run { animation:flick 2.4s ease-in-out infinite; }
  @keyframes flick { 0%,100%{ opacity:.10 } 45%{ opacity:.22 } 55%{ opacity:.13 } }

  /* status chip */
  .chip { position:absolute; transform:translate(-50%,-100%); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.08em; padding:4px 9px; border:1px solid var(--c); color:var(--c); background:rgba(10,12,18,.82); border-radius:3px; white-space:nowrap; box-shadow:0 0 12px color-mix(in srgb,var(--c) 35%,transparent); transition:opacity .3s; }
  .chip::after { content:''; position:absolute; bottom:-5px; left:50%; margin-left:-4px; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--c); }
  .chip .blink { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--c); margin-right:6px; vertical-align:middle; box-shadow:0 0 6px var(--c); animation:pulse 1s ease-in-out infinite; }

  .side { display:flex; flex-direction:column; gap:12px; }
  .panel { background:linear-gradient(180deg,var(--bg-1),var(--bg-2)); border:1px solid var(--line); padding:14px; }
  .panel-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .panel-title { font-family:'Syne',sans-serif; font-weight:700; font-size:10px; letter-spacing:0.25em; text-transform:uppercase; }
  .panel-meta { font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-dim); }
  .panel-meta.live { color:var(--floof); }
  .crew { display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line); }
  .crew:last-child { border-bottom:none; }
  .crew-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:0 0 8px currentColor; animation:pulse 1.4s ease-in-out infinite; }
  .crew-info { flex:1; min-width:0; }
  .crew-name { font-family:'Syne',sans-serif; font-weight:700; font-size:13px; }
  .crew-role { font-size:10px; color:var(--text-dim); margin-top:1px; }
  .crew-task { font-size:10px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .feed { height:300px; overflow-y:auto; font-size:11px; line-height:1.55; padding-right:4px; }
  .feed::-webkit-scrollbar { width:4px; } .feed::-webkit-scrollbar-track{ background:transparent; } .feed::-webkit-scrollbar-thumb{ background:var(--line-bright); }
  .ev { display:flex; gap:8px; margin-bottom:5px; align-items:flex-start; }
  .ev-time { color:var(--text-dim); font-size:9px; padding-top:2px; flex-shrink:0; width:42px; }
  .ev-mark { width:3px; align-self:stretch; flex-shrink:0; margin-top:4px; background:var(--text-dim); }
  .ev-body { flex:1; color:var(--text-mid); word-wrap:break-word; }
  .controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .btn { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; padding:12px 22px; background:transparent; color:var(--text); border:1px solid var(--line-bright); cursor:pointer; transition:all .2s; }
  .btn.primary { background:linear-gradient(120deg,var(--corgi),var(--floof)); border-color:transparent; color:#0a0c12; font-weight:700; }
  .btn.primary:hover { transform:translateY(-1px); }
  .btn.ghost:hover { border-color:var(--floof); color:var(--floof); }
  .footnote { margin-top:22px; text-align:center; font-size:9px; letter-spacing:.25em; text-transform:uppercase; color:var(--text-dim); }
  @keyframes pulse { 0%,100%{ opacity:1; transform:scale(1) } 50%{ opacity:.5; transform:scale(.8) } }

  /* top-corner nav (home + share) */
  .topnav-btn { position:fixed; top:12px; width:34px; height:34px; border-radius:50%;
    background:rgba(18,22,31,0.72); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:0.5px solid var(--line); color:var(--text); font-size:15px; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
    text-decoration:none; z-index:30; transition:background .15s, transform .15s, border-color .15s; }
  .topnav-btn:hover { background:rgba(40,48,60,0.85); border-color:var(--line-bright); transform:translateY(-1px); }
  .topnav-btn:active { transform:translateY(0); }
  .topnav-l { left:12px; }
  .topnav-r { right:12px; }
  .topnav-btn .glyph { display:block; transform:translateY(-0.5px); }
</style>
</head>
<body>
<div class="app">

  <a href="/" class="topnav-btn topnav-l" id="homeBtn" aria-label="back to portfolio" title="back to portfolio"><span class="glyph">←</span></a>
  <button class="topnav-btn topnav-r" id="shareBtn" aria-label="share this page" title="share this page"><span class="glyph">⇪</span></button>

  <header class="hero">
    <div>
      <h1 class="hero-title">PUM’S OFFICE</h1>
      <div class="hero-sub"><span class="dot"></span>the studio is open · everyone's working</div>
    </div>
    <div>
      <div class="hero-clock" id="clock">10:24</div>
      <div class="hero-date" id="date">THU 15 MAY · 24°C</div>
    </div>
  </header>
  <div class="grid">
    <div class="stage-wrap">
      <div class="stage-head"><div class="stage-title">▸ The Studio</div><div class="stage-meta" id="meta">working</div></div>
      <div class="stage" id="stage">
        <img class="stage-bg" src="./assets/office.jpg" alt="studio">
        <!-- ambient + dog layers injected by JS -->
      </div>
    </div>
    <div class="side">
      <div class="panel"><div class="panel-head"><div class="panel-title">Crew</div><div class="panel-meta">2 on shift</div></div><div id="crew"></div></div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Work Log</div><div class="panel-meta" id="logsrc">scripted</div></div>
        <div class="feed" id="feed"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn primary" id="toggleBtn">⏸ Pause</button>
    <button class="btn ghost" id="musicBtn">♪ Music: off</button>
    <button class="btn ghost" id="styleBtn">Style: Café Jazz</button>
    <button class="btn ghost" id="aiBtn">✦ Generate live log</button>
  </div>
  <div class="footnote">your art, untouched · ambient fx + claude work-log</div>
</div>

<script>
const DATA = {"corgi":"./assets/corgi.png","floof":"./assets/floof.png"};
const IMG_W=1402, IMG_H=1122;
const pct=(v,t)=>v/t*100;

const DOGS = {
  Corgi: { role:'Project Manager', color:'#ffae42', box:[408,418,642,700],
    tasks:['grooming the backlog','planning the sprint','reviewing pull requests','sniffing out requirements','updating the roadmap','triaging issues'] },
  Floof: { role:'Systems Analyst', color:'#8fe388', box:[893,415,1132,702],
    tasks:['profiling slow queries','tracing the logs','analyzing metrics','debugging the build','optimizing indexes','chasing a memory leak'] }
};

// ambient effect placements (% of stage)
const AMBIENT = {
  lamps: [ {x:20.3, y:39.7, w:13}, {x:87.7, y:41.7, w:12} ],
  screens: [ {x:20.0, y:48.6, w:16, h:13, c:'rgba(150,200,255,0.9)'},   // corgi monitor
             {x:77.7, y:54.5, w:13, h:10, c:'rgba(150,200,255,0.9)'} ], // floof laptop
  window: {x:1.7, y:4, w:15.3, h:26}
};

const $=id=>document.getElementById(id);
const stage=$('stage'), feed=$('feed'), crewEl=$('crew'), meta=$('meta'), logsrc=$('logsrc');
let running=true; let liveTasks=false;
const state={ task:{}, timers:[] };

// ---- build ambient layers ----
// window day/night
const win=AMBIENT.window;
for(const cls of ['window-fx','window-warm']){
  const el=document.createElement('div'); el.className=cls+' run';
  el.style.left=win.x+'%'; el.style.top=win.y+'%'; el.style.width=win.w+'%'; el.style.height=win.h+'%';
  stage.appendChild(el);
}
// lamps
AMBIENT.lamps.forEach((l,i)=>{
  const el=document.createElement('div'); el.className='lamp run'; el.id='lamp-'+i;
  el.style.left=l.x+'%'; el.style.top=l.y+'%'; el.style.width=l.w+'%'; el.style.aspectRatio='1/1';
  el.style.animationDelay=(i*-2.2)+'s';
  stage.appendChild(el);
});
// screens
AMBIENT.screens.forEach((s,i)=>{
  const el=document.createElement('div'); el.className='screen run'; el.id='screen-'+i;
  el.style.left=s.x+'%'; el.style.top=s.y+'%'; el.style.width=s.w+'%'; el.style.height=s.h+'%';
  el.style.background='radial-gradient(circle, '+s.c+', transparent 65%)';
  el.style.animationDelay=(i*-0.4)+'s';
  stage.appendChild(el);
});

// ---- build dogs ----
for(const [name,d] of Object.entries(DOGS)){
  const [x0,y0,x1,y1]=d.box;
  const wrap=document.createElement('div'); wrap.className='dog breathe'; wrap.id='dog-'+name;
  wrap.style.left=pct(x0,IMG_W)+'%'; wrap.style.top=pct(y0,IMG_H)+'%'; wrap.style.width=pct(x1-x0,IMG_W)+'%';
  wrap.style.animationDelay=(name==='Floof'?'-1.6s':'0s');
  wrap.innerHTML=`<img src="${DATA[name.toLowerCase()]}" alt="${name}">`;
  stage.appendChild(wrap);
  // monitor glow on dog face
  const g=document.createElement('div'); g.className='glow run'; g.id='glow-'+name;
  const gw=(x1-x0)*0.7, gx=x0+(x1-x0)*0.15, gy=y0+(y1-y0)*0.05;
  g.style.left=pct(gx,IMG_W)+'%'; g.style.top=pct(gy,IMG_H)+'%'; g.style.width=pct(gw,IMG_W)+'%'; g.style.height=pct(gw*0.8,IMG_H)+'%';
  g.style.background='radial-gradient(circle, '+d.color+', transparent 65%)';
  stage.appendChild(g);
  // chip
  const chip=document.createElement('div'); chip.className='chip'; chip.id='chip-'+name; chip.style.setProperty('--c',d.color);
  chip.style.left=pct(x0+(x1-x0)*0.5,IMG_W)+'%'; chip.style.top=pct(y0-6,IMG_H)+'%';
  chip.innerHTML='<span class="blink"></span><span id="chiptxt-'+name+'">working</span>';
  stage.appendChild(chip);
}
// crew panel
for(const [name,d] of Object.entries(DOGS)){
  const row=document.createElement('div'); row.className='crew';
  row.innerHTML=`<div class="crew-dot" style="color:${d.color}"></div>
    <div class="crew-info"><div class="crew-name" style="color:${d.color}">${name}</div>
    <div class="crew-role">${d.role}</div>
    <div class="crew-task" id="task-${name}" style="color:${d.color}">booting up…</div></div>`;
  crewEl.appendChild(row);
}

function now(){ return new Date().toTimeString().slice(0,5); }
function logEv(name,text){
  const c=name&&DOGS[name]?DOGS[name].color:'';
  const el=document.createElement('div'); el.className='ev';
  el.innerHTML=`<div class="ev-time">${now()}</div><div class="ev-mark" style="${c?`background:${c};box-shadow:0 0 4px ${c}`:''}"></div><div class="ev-body" style="${c?`color:${c}`:''}">${text}</div>`;
  feed.appendChild(el); feed.scrollTop=feed.scrollHeight;
  while(feed.children.length>60) feed.removeChild(feed.firstChild);
}

function tween(name,cls,dur){ const d=$('dog-'+name); d.classList.add(cls); const t=setTimeout(()=>d.classList.remove(cls),dur); state.timers.push(t); }

function setTask(name,task){
  state.task[name]=task;
  $('task-'+name).textContent=task;
  $('chiptxt-'+name).textContent=task.split(' ').slice(0,2).join(' ');
  logEv(name,`<b>${name}</b> — ${task}`);
  // typing burst
  const dog=$('dog-'+name); dog.classList.remove('breathe'); dog.classList.add('type');
  const t=setTimeout(()=>{ dog.classList.remove('type'); dog.classList.add('breathe'); },2200+Math.random()*1500);
  state.timers.push(t);
}
function cycle(name){
  if(!running) return;
  const d=DOGS[name];
  const task=d.tasks[Math.floor(Math.random()*d.tasks.length)];
  if(task!==state.task[name]) setTask(name,task);
  const t=setTimeout(()=>cycle(name),4500+Math.random()*4000); state.timers.push(t);
}
// random idle flourishes: head-tilt / ear-perk
function flourish(){
  if(!running) return;
  const names=Object.keys(DOGS); const n=names[Math.floor(Math.random()*names.length)];
  const dog=$('dog-'+n);
  if(!dog.classList.contains('type')){
    if(Math.random()<0.5) tween(n,'tilt',1300); else tween(n,'perk',600);
  }
  const t=setTimeout(flourish, 3500+Math.random()*4000); state.timers.push(t);
}

function clockTick(){ $('clock').textContent=now(); }

// ---- live Claude work-log (graceful fallback) ----
// When hosted with the included proxy (server.js), this hits /api/worklog and works for real.
// Opened as a plain file, the fetch fails and we fall back to the built-in writing.
const WORKLOG_ENDPOINT = 'https://pums-office-worklog.pbfluffygaming.workers.dev'; // <- set to your Worker URL
async function generateLiveLog(){
  logEv(null,'Asking Claude for fresh tasks…');
  try{
    const res=await fetch(WORKLOG_ENDPOINT,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001', max_tokens:1000,
        messages:[{role:'user',content:
          'Two dog coworkers at a cozy late-night software studio. Corgi is the Project Manager, Floof is the Systems Analyst. '+
          'Return ONLY valid JSON (no markdown) shaped exactly as {"Corgi":[...],"Floof":[...]} where each array has 6 short present-tense work activities, 3-6 words each, playful and a little dog-themed but about real software work.'}]
      })
    });
    if(!res.ok) throw new Error('http '+res.status);
    const data=await res.json();
    let text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    text=text.replace(/```json|```/g,'').trim();
    const m=text.match(/\{[\s\S]*\}/); const parsed=JSON.parse(m?m[0]:text);
    if(parsed.Corgi&&parsed.Floof){
      DOGS.Corgi.tasks=parsed.Corgi; DOGS.Floof.tasks=parsed.Floof;
      liveTasks=true; logsrc.textContent='live · claude'; logsrc.classList.add('live');
      logEv(null,'Live tasks loaded from Claude ✦');
      return true;
    }
    throw new Error('bad shape');
  }catch(err){
    logEv(null,'Live log unavailable here — using built-in writing.');
    logsrc.textContent='scripted'; logsrc.classList.remove('live');
    return false;
  }
}

function start(){
  running=true; meta.textContent='working';
  document.querySelectorAll('.lamp,.screen,.glow,.window-fx,.window-warm').forEach(e=>e.classList.add('run'));
  Object.keys(DOGS).forEach((n,i)=>{ const t=setTimeout(()=>cycle(n),i*900); state.timers.push(t); $('dog-'+n).classList.add('breathe'); $('chip-'+n).style.opacity='1'; });
  const f=setTimeout(flourish,3000); state.timers.push(f);
}
function stop(){
  running=false; meta.textContent='paused';
  state.timers.forEach(t=>clearTimeout(t)); state.timers=[];
  document.querySelectorAll('.lamp,.screen,.glow,.window-fx,.window-warm').forEach(e=>e.classList.remove('run'));
  Object.keys(DOGS).forEach(n=>{ const d=$('dog-'+n); d.classList.remove('type','breathe','tilt','perk'); $('chip-'+n).style.opacity='.4'; });
}
$('toggleBtn').addEventListener('click',()=>{ if(running){ stop(); $('toggleBtn').textContent='▶ Resume'; } else { start(); $('toggleBtn').textContent='⏸ Pause'; } });
$('aiBtn').addEventListener('click',generateLiveLog);

setInterval(clockTick,1000); clockTick();

// ---- multi-style café music engine (pure Web Audio, no files) ----
const Music = (function(){
  let actx=null, master=null, warmF=null, chordBus=null, drySum=null, reverbGain=null, conv=null, crackleGain=null;
  let playing=false, lookahead=null, nextNote=0, step=0;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  let noiseBuf=null;
  function noise(){ if(noiseBuf) return noiseBuf; const n=actx.sampleRate*2; noiseBuf=actx.createBuffer(1,n,actx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return noiseBuf; }
  function makeReverb(sec,decay){ const len=Math.floor(actx.sampleRate*sec); const buf=actx.createBuffer(2,len,actx.sampleRate); for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } const cv=actx.createConvolver(); cv.buffer=buf; return cv; }

  // ---- styles ----
  const STYLES = {
    'Café Jazz': { bpm:70, swing:0.20, inst:'rhodes', reverb:0.32, warm:3400, crackle:0,
      chords:[[62,65,69,72,76],[55,59,65,69,64],[60,64,67,71,74],[57,61,64,67,70]],
      bass:[38,43,36,45],
      comp:[{s:0,d:7,v:0.9},{s:6,d:4,v:0.5},{s:10,d:5,v:0.6}],
      bassHits:[{s:0,o:0},{s:10,o:7}],
      drums:{kick:[0,8],brush:[4,12],ride:'swing8'} },
    'Lo-fi': { bpm:74, swing:0.12, inst:'pad', reverb:0.18, warm:3000, crackle:0.012,
      chords:[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]],
      bass:[36,33,29,31],
      comp:[{s:0,d:16,v:0.9}],
      bassHits:[{s:0,o:0},{s:8,o:0}],
      drums:{kick:[0,10],snare:[4,12],hat:'8'} },
    'Bossa': { bpm:96, swing:0.0, inst:'pluck', reverb:0.22, warm:4200, crackle:0,
      chords:[[60,64,67,71,74],[57,60,64,67,71],[58,62,65,69],[55,59,62,65,69]],
      bass:[36,45,34,43],
      comp:[{s:0,d:6,v:0.7},{s:3,d:3,v:0.45},{s:6,d:4,v:0.6},{s:11,d:4,v:0.5}],
      bassHits:[{s:0,o:0},{s:6,o:7}],
      drums:{rim:[0,3,6,10,12],shaker:'16'} },
    'Late Night': { bpm:60, swing:0.0, inst:'pad', reverb:0.5, warm:2500, crackle:0.006,
      chords:[[60,64,67,71,74],[57,60,64,67,71],[53,57,60,64,67],[55,58,62,65,69]],
      bass:[36,33,29,31],
      comp:[{s:0,d:16,v:0.7}],
      bassHits:[{s:0,o:0}],
      drums:{} }
  };
  const ORDER = ['Café Jazz','Lo-fi','Bossa','Late Night'];
  let cur = STYLES['Café Jazz'];

  // ---- voices ----
  function rhodes(midi,t,dur,vel){ const f=mtof(midi); const car=actx.createOscillator(); car.type='sine'; car.frequency.value=f; const mod=actx.createOscillator(); mod.type='sine'; mod.frequency.value=f; const mg=actx.createGain(); mg.gain.setValueAtTime(f*2.2*vel,t); mg.gain.exponentialRampToValueAtTime(f*0.15,t+0.45); mod.connect(mg).connect(car.frequency); const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.16*vel,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); car.connect(g).connect(chordBus); car.start(t); mod.start(t); car.stop(t+dur+0.1); mod.stop(t+dur+0.1); }
  function pad(midi,t,dur){ const o=actx.createOscillator(),o2=actx.createOscillator(); o.type='triangle'; o2.type='sine'; o.frequency.value=mtof(midi); o2.frequency.value=mtof(midi)*1.005; const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1100; const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.045,t+0.5); g.gain.linearRampToValueAtTime(0.038,t+dur*0.6); g.gain.linearRampToValueAtTime(0,t+dur); o.connect(f); o2.connect(f); f.connect(g).connect(chordBus); o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur); }
  function pluck(midi,t,vel){ const o=actx.createOscillator(),o2=actx.createOscillator(); o.type='triangle'; o2.type='sine'; o.frequency.value=mtof(midi); o2.frequency.value=mtof(midi)*2; const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(3200,t); f.frequency.exponentialRampToValueAtTime(800,t+0.3); const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12*vel,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.6); o.connect(f); o2.connect(f); f.connect(g).connect(chordBus); o.start(t); o2.start(t); o.stop(t+0.65); o2.stop(t+0.65); }
  function playChord(ch,t,dur,vel){ if(cur.inst==='rhodes') ch.forEach((n,i)=>rhodes(n,t+i*0.012,dur,vel*(i?0.85:1))); else if(cur.inst==='pluck') ch.forEach((n,i)=>pluck(n,t+i*0.02,vel*(i?0.8:1))); else ch.forEach(n=>pad(n,t,dur)); }
  function bassNote(midi,t,dur){ const o=actx.createOscillator(); o.type='triangle'; o.frequency.value=mtof(midi); const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=420; const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.13,t+0.03); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(f).connect(g).connect(drySum); o.start(t); o.stop(t+dur); }
  function kick(t){ const o=actx.createOscillator(),g=actx.createGain(); o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(42,t+0.13); g.gain.setValueAtTime(0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g).connect(drySum); o.start(t); o.stop(t+0.22); }
  function brush(t){ const s=actx.createBufferSource(); s.buffer=noise(); const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=0.6; const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.045,t+0.02); g.gain.exponentialRampToValueAtTime(0.0008,t+0.18); s.connect(bp).connect(g); g.connect(drySum); g.connect(conv); s.start(t); s.stop(t+0.2); }
  function snare(t){ const s=actx.createBufferSource(); s.buffer=noise(); const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; const g=actx.createGain(); g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14); s.connect(bp).connect(g).connect(drySum); s.start(t); s.stop(t+0.16); }
  function hat(t){ const s=actx.createBufferSource(); s.buffer=noise(); const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000; const g=actx.createGain(); g.gain.setValueAtTime(0.04,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05); s.connect(hp).connect(g).connect(drySum); s.start(t); s.stop(t+0.06); }
  function ride(t,vel){ const s=actx.createBufferSource(); s.buffer=noise(); const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6500; const g=actx.createGain(); g.gain.setValueAtTime(0.03*vel,t); g.gain.exponentialRampToValueAtTime(0.0006,t+0.08); s.connect(hp).connect(g).connect(drySum); s.start(t); s.stop(t+0.09); }
  function rim(t){ const o=actx.createOscillator(); o.type='square'; o.frequency.value=410; const g=actx.createGain(); g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0005,t+0.04); o.connect(g).connect(drySum); o.start(t); o.stop(t+0.05); }
  function shaker(t,vel){ const s=actx.createBufferSource(); s.buffer=noise(); const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=8200; const g=actx.createGain(); g.gain.setValueAtTime(0.02*vel,t); g.gain.exponentialRampToValueAtTime(0.0004,t+0.05); s.connect(hp).connect(g).connect(drySum); s.start(t); s.stop(t+0.06); }

  function schedule(s,t){
    const bar=Math.floor(s/16)%4, st=s%16, sd=60/cur.bpm/4;
    cur.comp.forEach(c=>{ if(c.s===st) playChord(cur.chords[bar],t,sd*c.d,c.v); });
    cur.bassHits.forEach(b=>{ if(b.s===st) bassNote(cur.bass[bar]+(b.o||0),t,sd*4); });
    const D=cur.drums;
    if(D.kick&&D.kick.includes(st)) kick(t);
    if(D.brush&&D.brush.includes(st)) brush(t);
    if(D.snare&&D.snare.includes(st)) snare(t);
    if(D.rim&&D.rim.includes(st)) rim(t);
    if(D.hat==='8'&&st%2===0){ const sw=(st%4===2)?sd*cur.swing:0; hat(t+sw); }
    if(D.ride==='swing8'&&st%2===0){ const sw=(st%4===2)?sd*cur.swing:0; ride(t+sw, st%4===0?0.9:0.6); }
    if(D.shaker==='16'){ shaker(t, st%2===0?0.9:0.5); }
  }
  function loop(){ while(nextNote<actx.currentTime+0.25){ schedule(step,nextNote); nextNote+=60/cur.bpm/4; step=(step+1)%(16*4); } }

  function applyStyle(){ if(!actx) return; reverbGain.gain.setTargetAtTime(cur.reverb,actx.currentTime,0.3); warmF.frequency.setTargetAtTime(cur.warm,actx.currentTime,0.3); crackleGain.gain.setTargetAtTime(cur.crackle,actx.currentTime,0.3); }

  function init(){
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.0;
    warmF=actx.createBiquadFilter(); warmF.type='lowpass'; warmF.frequency.value=cur.warm;
    master.connect(warmF).connect(actx.destination);
    drySum=actx.createGain(); drySum.connect(master);
    conv=makeReverb(2.6,2.2); reverbGain=actx.createGain(); reverbGain.gain.value=cur.reverb; conv.connect(reverbGain).connect(master);
    chordBus=actx.createGain(); chordBus.gain.value=0.9; chordBus.connect(drySum); chordBus.connect(conv);
    const lfo=actx.createOscillator(); lfo.type='sine'; lfo.frequency.value=4.5; const lg=actx.createGain(); lg.gain.value=0.05; lfo.connect(lg).connect(chordBus.gain); lfo.start();
    // continuous vinyl crackle, gated by style
    const src=actx.createBufferSource(); src.buffer=noise(); src.loop=true; const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2000; crackleGain=actx.createGain(); crackleGain.gain.value=cur.crackle; src.connect(hp).connect(crackleGain).connect(master); src.start();
  }
  return {
    styles(){ return ORDER; },
    current(){ return ORDER.find(n=>STYLES[n]===cur); },
    setStyle(name){ if(STYLES[name]){ cur=STYLES[name]; applyStyle(); } },
    isPlaying(){ return playing; },
    toggle(){
      if(!actx) init();
      if(!playing){ actx.resume(); playing=true; nextNote=actx.currentTime+0.15; step=0; lookahead=setInterval(loop,40); master.gain.cancelScheduledValues(actx.currentTime); master.gain.linearRampToValueAtTime(0.85,actx.currentTime+1.3); }
      else { playing=false; clearInterval(lookahead); master.gain.linearRampToValueAtTime(0.0,actx.currentTime+0.7); }
      return playing;
    }
  };
})();
$('musicBtn').addEventListener('click',()=>{
  const on=Music.toggle();
  $('musicBtn').textContent = on ? '♪ Music: on' : '♪ Music: off';
  $('musicBtn').classList.toggle('primary', on);
});
$('styleBtn').addEventListener('click',()=>{
  const order=Music.styles(); const i=order.indexOf(Music.current());
  const next=order[(i+1)%order.length];
  Music.setStyle(next);
  $('styleBtn').textContent='Style: '+next;
  logEv(null,'Music style → '+next);
});



// ---- share button (Web Share API w/ clipboard fallback) ----
$('shareBtn').addEventListener('click', async () => {
  const data = {
    title: "Pum’s Office",
    text: 'A cozy late-night studio where Corgi & Floof keep working. Music, lamps, live AI work-log.',
    url: location.href
  };
  if (navigator.share) {
    try { await navigator.share(data); }
    catch (e) { if (e.name !== 'AbortError') console.warn('share:', e); }
    return;
  }
  const btn = $('shareBtn'), orig = btn.innerHTML;
  try {
    await navigator.clipboard.writeText(location.href);
    btn.innerHTML = '<span class="glyph">✓</span>';
    btn.title = 'link copied';
    setTimeout(() => { btn.innerHTML = orig; btn.title = 'share this page'; }, 1400);
  } catch {
    window.prompt('Copy this link:', location.href);
  }
});

logEv(null,'Studio opened. Good code, good dogs.');
start();
