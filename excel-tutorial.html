// ── Formula Anatomy ──────────────────────────────────────────────────────────

function FormulaAnatomy({ parts, accent }) {
  const [active, setActive] = useState(null);
  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", alignItems: "flex-end", gap: 3, marginBottom: 18, padding: "10px 0 20px" }}>
        {parts.map((p, i) => {
          if (p.type === "bracket" || p.type === "sep") {
            return <span key={i} style={{ fontFamily: "monospace", fontSize: 20, color: "#94a3b8", fontWeight: 700, lineHeight: 1 }}>{p.text}</span>;
          }
          const isActive = active?.text === p.text;
          return (
            <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              {p.argLabel && (
                <span style={{ fontSize: 9, fontWeight: 800, color: isActive ? p.color : "#cbd5e1", letterSpacing: 0.5, textTransform: "uppercase", transition: "color 0.15s" }}>
                  {p.argLabel}
                </span>
              )}
              <button
                onClick={() => setActive(isActive ? null : p)}
                style={{
                  fontFamily: "monospace",
                  fontSize: p.type === "fn" ? 17 : 14,
                  fontWeight: p.type === "fn" ? 800 : 600,
                  color: isActive ? "white" : p.color,
                  background: isActive ? p.color : p.color + "15",
                  border: `2px solid ${isActive ? p.color : p.color + "50"}`,
                  borderRadius: 8, padding: p.type === "fn" ? "5px 10px" : "4px 8px",
                  cursor: "pointer", transition: "all 0.15s", lineHeight: 1,
                }}
              >{p.text}</button>
            </div>
          );
        })}
      </div>

      <div style={{ minHeight: 90 }}>
        {active ? (
          <div style={{ background: active.color + "0c", border: `1.5px solid ${active.color}40`, borderLeft: `4px solid ${active.color}`, borderRadius: 10, padding: "14px 16px", animation: "popIn 0.15s ease" }}>
            <div style={{ fontSize: 12, fontWeight: 800, color: active.color, marginBottom: 6, letterSpacing: 0.3 }}>
              {active.argLabel ? `[${active.argLabel}]` : "[FUNCTION]"} — {active.title}
            </div>
            <div style={{ fontSize: 14, color: "#1e293b", lineHeight: 1.7 }}>{active.desc}</div>
          </div>
        ) : (
          <div style={{ background: "#f8fafc", border: "1.5px dashed #e2e8f0", borderRadius: 10, padding: "14px 16px", textAlign: "center", color: "#94a3b8", fontSize: 13 }}>
            👆 แตะแต่ละส่วนของสูตรเพื่อดูคำอธิบาย
          </div>
        )}
      </div>

      {/* Legend */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
        {parts.filter(p => p.type === "arg").map((p, i) => (
          <button key={i} onClick={() => setActive(active?.text === p.text ? null : p)} style={{
            display: "flex", alignItems: "center", gap: 5,
            background: active?.text === p.text ? p.color + "15" : "#f1f5f9",
            border: `1.5px solid ${active?.text === p.text ? p.color : "#e2e8f0"}`,
            borderRadius: 20, padding: "4px 10px", cursor: "pointer",
            fontSize: 11, color: active?.text === p.text ? p.color : "#64748b",
            fontWeight: 700, transition: "all 0.15s", fontFamily: "inherit",
          }}>
            <span style={{ width: 7, height: 7, borderRadius: "50%", background: p.color, flexShrink: 0 }} />
            {p.argLabel || p.title}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── Steps ────────────────────────────────────────────────────────────────────

function Steps({ steps, accent }) {
  const [cur, setCur] = useState(0);
  return (
    <div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {steps.map((_, i) => (
          <button key={i} onClick={() => setCur(i)} style={{
            width: 32, height: 32, borderRadius: "50%", border: "none",
            background: i === cur ? accent : i < cur ? accent + "40" : "#f1f5f9",
            color: i === cur ? "white" : i < cur ? accent : "#94a3b8",
            fontWeight: 800, fontSize: 13, cursor: "pointer", transition: "all 0.2s",
            fontFamily: "inherit",
          }}>{i + 1}</button>
        ))}
      </div>
      <div style={{ background: accent + "08", border: `1.5px solid ${accent}25`, borderRadius: 12, padding: "16px 18px", minHeight: 70 }}>
        <div style={{ fontSize: 13, color: "#64748b", marginBottom: 6 }}>ขั้นตอนที่ {steps[cur].n}</div>
        <div style={{ fontSize: 15, color: "#1e293b", lineHeight: 1.7, fontWeight: 500 }}>{steps[cur].text}</div>
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <Btn onClick={() => setCur(c => Math.max(0, c - 1))} disabled={cur === 0}>← ก่อนหน้า</Btn>
        <Btn onClick={() => setCur(c => Math.min(steps.length - 1, c + 1))} disabled={cur === steps.length - 1}>ถัดไป →</Btn>
      </div>
    </div>
  );
}

function Btn({ onClick, disabled, children }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      background: disabled ? "#f8fafc" : "#0f172a", color: disabled ? "#cbd5e1" : "white",
      border: `1.5px solid ${disabled ? "#e2e8f0" : "#0f172a"}`, borderRadius: 8, padding: "7px 14px",
      fontSize: 13, cursor: disabled ? "default" : "pointer", fontFamily: "inherit",
    }}>{children}</button>
  );
}

// ── Mistakes ─────────────────────────────────────────────────────────────────

          return (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 70px 90px", padding: "5px 10px", gap: 8, borderTop: "1px solid #f8fafc", background: match ? "#fdf2f8" : "white", transition: "all 0.2s" }}>
              <span style={{ color: "#374151" }}>{p.name}</span>
              <span style={{ fontFamily: "monospace", color: "#374151" }}>{p.score}</span>
              <span style={{ fontWeight: 700, color: p.res === "ผ่าน" ? "#16a34a" : "#ef4444", ...(match ? { background: crit === "ผ่าน" ? "#dcfce7" : "#fee2e2", borderRadius: 4, padding: "1px 6px", display: "inline-block" } : {}) }}>{p.res}</span>
            </div>
          );
        })}
      </div>
      <ResultChip label={`${count} คน`} accent="#ec4899" />
    </div>
  );
}

function IferrDemo() {
  const [code, setCode] = useState("P099");
  const found = PRODS.find(p => p.code === code.toUpperCase().trim());
  return (
    <div>
      <FormulaBar formula={`=IFERROR(VLOOKUP(G1,$A$2:$D$6,2,FALSE),"ไม่พบสินค้า")`} accent="#6366f1" />
      <div style={{ fontSize: 12, color: "#64748b", marginBottom: 8 }}>ลองใส่รหัสที่มี (P001–P005) หรือรหัสที่ไม่มีในระบบ</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
        {["P002", "P099", "ABC", "P004"].map(c => (
          <button key={c} onClick={() => setCode(c)} style={{ padding: "5px 12px", borderRadius: 6, border: `1.5px solid ${code === c ? "#6366f1" : "#e2e8f0"}`, background: code === c ? "#eef2ff" : "white", color: code === c ? "#6366f1" : "#64748b", fontSize: 12, fontFamily: "monospace", cursor: "pointer", fontWeight: 600 }}>{c}</button>
        ))}
        <input value={code} onChange={e => setCode(e.target.value)} style={{ ...IS, width: 90, textTransform: "uppercase", fontFamily: "monospace", fontSize: 13 }} placeholder="พิมพ์เอง" />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
        <div style={{ background: "#fff5f5", border: "1.5px solid #fecaca", borderRadius: 10, padding: "12px 14px", opacity: found ? 0.35 : 1, transition: "opacity 0.25s" }}>
          <div style={{ fontSize: 11, color: "#ef4444", fontWeight: 800, marginBottom: 6 }}>❌ ถ้าไม่มี IFERROR</div>
          <code style={{ fontSize: 18, color: "#dc2626", fontWeight: 800 }}>#N/A</code>
          <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 4 }}>error น่าเกลียด</div>
        </div>
        <div style={{ background: "#f0fdf4", border: "1.5px solid #bbf7d0", borderRadius: 10, padding: "12px 14px", opacity: found ? 0.35 : 1, transition: "opacity 0.25s" }}>
          <div style={{ fontSize: 11, color: "#16a34a", fontWeight: 800, marginBottom: 6 }}>✅ มี IFERROR</div>
          <code style={{ fontSize: 14, color: "#15803d", fontWeight: 700 }}>"ไม่พบสินค้า"</code>
          <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 4 }}>สวยงาม เข้าใจง่าย</div>
        </div>
      </div>
      {found && (
        <div style={{ background: "#eef2ff", border: "1.5px solid #c7d2fe", borderRadius: 10, padding: "12px 14px" }}>
          <div style={{ fontSize: 11, color: "#6366f1", fontWeight: 800, marginBottom: 4 }}>✓ เจอข้อมูล → แสดงผลปกติจาก VLOOKUP</div>
          <code style={{ fontSize: 15, color: "#4338ca", fontWeight: 700 }}>{found.name}</code>
        </div>
      )}
      {!found && <ResultChip label={'"ไม่พบสินค้า"'} accent="#6366f1" />}
    </div>
  );
}

function Demo({ id }) {
  if (id === "sum") return <SumDemo />;
  if (id === "if") return <IFDemo />;
  if (id === "vlookup") return <VlookupDemo />;
  if (id === "sumif") return <SumifDemo />;
  if (id === "countif") return <CountifDemo />;
  if (id === "iferror") return <IferrDemo />;
  return null;
}

// ── Section Card ──────────────────────────────────────────────────────────────

function Card({ icon, title, children }) {
  return (
    <div style={{ background: "white", border: "1.5px solid #e2e8f0", borderRadius: 14, padding: "18px 20px" }}>
      <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 1.5, color: "#94a3b8", textTransform: "uppercase", marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}>
        {icon && <span>{icon}</span>}{title}
      </div>
      {children}
    </div>
  );
}

// ── Main ──────────────────────────────────────────────────────────────────────

function App() {
  const [active, setActive] = useState(0);
  const f = FORMULAS[active];
  return (
    <div style={{ fontFamily: "'Sarabun','Noto Sans Thai',sans-serif", background: "#f1f5f9", minHeight: "100vh" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @keyframes popIn { from { opacity:0; transform:translateY(3px) } to { opacity:1; transform:translateY(0) } }
        input:focus, select:focus { border-color: #93c5fd !important; outline: none; box-shadow: 0 0 0 3px #eff6ff; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      `}</style>

      {/* Header */}
      <div style={{ background: "white", borderBottom: "1.5px solid #e2e8f0", padding: "13px 20px", display: "flex", alignItems: "center", gap: 12, position: "sticky", top: 0, zIndex: 50 }}>
        <div style={{ width: 36, height: 36, background: "linear-gradient(135deg,#217346,#34d399)", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", color: "white", fontWeight: 900, fontSize: 16, flexShrink: 0 }}>X</div>
        <div>
          <div style={{ fontSize: 15, fontWeight: 800, color: "#0f172a" }}>Excel สำหรับมือใหม่</div>
          <div style={{ fontSize: 11, color: "#94a3b8" }}>แตะแต่ละส่วนของสูตรเพื่อดูคำอธิบาย · ทดลองแก้ค่าได้</div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => { window.location.href = '../' }} title="กลับสู่หน้าแรก" aria-label="Home" style={{ background: "#f8fafc", border: "1px solid #e2e8f0", borderRadius: 8, padding: "4px 10px", height: 30, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center" }}>🏠</button>
          <div style={{ background: "#f8fafc", border: "1px solid #e2e8f0", borderRadius: 20, padding: "4px 12px", fontSize: 12, color: "#64748b" }}>{active + 1}/{FORMULAS.length}</div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ background: "white", borderBottom: "1.5px solid #e2e8f0", display: "flex", overflowX: "auto", padding: "0 10px" }}>
        {FORMULAS.map((fm, i) => (
          <button key={fm.id} onClick={() => setActive(i)} style={{
            padding: "10px 13px", border: "none", background: "transparent", cursor: "pointer",
            fontFamily: "inherit", fontSize: 13, fontWeight: active === i ? 700 : 500,
            color: active === i ? fm.accent : "#64748b",
            borderBottom: `3px solid ${active === i ? fm.accent : "transparent"}`,
            whiteSpace: "nowrap", transition: "all 0.15s", display: "flex", alignItems: "center", gap: 5,
          }}>
            <span style={{ fontFamily: "monospace", fontSize: 13 }}>{fm.emoji}</span>{fm.label}
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{ maxWidth: 780, margin: "0 auto", padding: "16px", display: "flex", flexDirection: "column", gap: 14 }}>

        {/* Hero */}
        <div style={{ background: f.accent, borderRadius: 14, padding: "18px 20px", color: "white" }}>
          <div style={{ fontSize: 12, opacity: 0.75, marginBottom: 4, fontWeight: 600 }}>={f.label}()</div>
          <div style={{ fontSize: 20, fontWeight: 800, letterSpacing: -0.4, marginBottom: 8 }}>{f.tagline}</div>
          <div style={{ fontSize: 13, lineHeight: 1.75, opacity: 0.9 }}>{f.intro}</div>
        </div>

        {/* Use cases */}
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {f.usecases.map((u, i) => <span key={i} style={{ background: f.accentLight, color: f.accent, borderRadius: 20, padding: "4px 12px", fontSize: 12, fontWeight: 700 }}>{u}</span>)}
        </div>

        {/* Anatomy */}
        <Card icon="🔬" title="กายวิภาคของสูตร — แตะแต่ละส่วนเพื่อดูคำอธิบาย">
          <FormulaAnatomy parts={f.parts} accent={f.accent} />
        </Card>

        {/* Steps */}
        <Card icon="⚙️" title="ขั้นตอนการทำงานทีละ step">
          <Steps steps={f.steps} accent={f.accent} />
        </Card>

        {/* Live demo */}
        <Card icon="🧪" title="ทดลองใช้งาน — แก้ค่าได้เลย">
          <Demo id={f.id} />
        </Card>

        {/* Mistakes */}
        <Card icon="⚠️" title="ข้อผิดพลาดที่มือใหม่มักทำ">
          <Mistakes list={f.mistakes} />
        </Card>

        {/* Bonus */}
        {f.bonus && (
          <div style={{ background: "#0f172a", borderRadius: 14, padding: "16px 18px" }}>
            <div style={{ fontSize: 11, color: "#4ade80", fontWeight: 800, letterSpacing: 1, marginBottom: 8 }}>⭐ ขั้นต่อไป — {f.bonus.label}</div>
            <code style={{ display: "block", fontFamily: "monospace", fontSize: 13, color: "#a5f3fc", marginBottom: 8, wordBreak: "break-all", lineHeight: 1.7 }}>{f.bonus.formula}</code>
            <div style={{ fontSize: 12, color: "#64748b", lineHeight: 1.6 }}>{f.bonus.desc}</div>
          </div>
        )}

        {/* Nav */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", paddingBottom: 24 }}>
          <Btn onClick={() => setActive(a => Math.max(0, a - 1))} disabled={active === 0}>← ก่อนหน้า</Btn>
          <div style={{ display: "flex", gap: 5 }}>
            {FORMULAS.map((fm, i) => (
              <div key={i} onClick={() => setActive(i)} style={{ width: 8, height: 8, borderRadius: "50%", cursor: "pointer", transition: "all 0.2s", background: i === active ? fm.accent : "#cbd5e1", transform: i === active ? "scale(1.5)" : "scale(1)" }} />
            ))}
          </div>
          <Btn onClick={() => setActive(a => Math.min(FORMULAS.length - 1, a + 1))} disabled={active === FORMULAS.length - 1}>ถัดไป →</Btn>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
