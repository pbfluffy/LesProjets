<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Korea 2026 · BTS ARIRANG 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Space+Mono:wght@400;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4EEE2;
    --paper-2:#FBF7EF;
    --ink:#2A1B33;
    --ink-soft:#5C4A66;
    --line:#E0D5C4;
    --purple:#6D28D9;
    --purple-deep:#4C1D95;
    --gold:#C18A21;
    --naver:#03C75A;

    --flight:#3B6FB0;
    --transit:#7A7184;
    --hotel:#C18A21;
    --food:#D2552E;
    --cafe:#8B5E34;
    --landmark:#7C3AED;
    --beach:#138A9A;
    --concert:#6D28D9;
    --shop:#C2407A;
    --beauty:#D9608A;
    --fun:#2E9E5B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'Noto Sans Thai','Noto Sans KR',sans-serif;
    font-size:16px;line-height:1.5;
    background-image:radial-gradient(circle at 18% -10%, rgba(109,40,217,.06), transparent 45%),
                     radial-gradient(circle at 110% 8%, rgba(193,138,33,.07), transparent 40%);
    background-attachment:fixed;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 18px 90px}

  /* ---------- HEADER ---------- */
  header{padding:30px 0 16px;position:relative}
  .kicker{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--purple-deep);margin:0 0 8px}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(44px,13vw,86px);
    line-height:.92;letter-spacing:-.02em;margin:0}
  h1 .yr{font-style:italic;font-weight:500;color:var(--purple)}
  .sub{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(17px,4.6vw,23px);
    color:var(--ink-soft);margin:10px 0 0}
  .facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .fact{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.05em;
    background:var(--paper-2);border:1px solid var(--line);border-radius:30px;
    padding:6px 13px;display:flex;align-items:center;gap:6px}

  /* ---------- COUNTDOWN ---------- */
  .count{margin-top:20px;background:var(--ink);color:var(--paper-2);border-radius:18px;
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
    gap:10px;box-shadow:0 14px 30px -18px rgba(42,27,51,.8)}
  .count .lbl{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.22em;
    text-transform:uppercase;opacity:.7;max-width:90px;line-height:1.4}
  .clock{display:flex;gap:6px}
  .clock .u{text-align:center;min-width:50px}
  .clock .n{font-family:'Fraunces',serif;font-weight:900;font-size:30px;line-height:1;color:#C9A6FF}
  .clock .t{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.18em;
    text-transform:uppercase;opacity:.6;margin-top:5px}
  .count.go .n{color:#9FE6B6}

  /* ---------- TABS ---------- */
  .tabs{position:sticky;top:0;z-index:40;display:flex;gap:6px;margin:22px 0 6px;
    padding:10px 0;background:linear-gradient(var(--paper) 72%, transparent)}
  .tab{flex:1;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.04em;
    text-transform:uppercase;padding:11px 4px;border:1.5px solid var(--ink);
    background:transparent;color:var(--ink);border-radius:12px;cursor:pointer;
    font-weight:700;transition:.18s;line-height:1.2}
  .tab .th{display:block;font-family:'Noto Sans Thai';font-size:10px;letter-spacing:0;
    opacity:.65;text-transform:none;margin-top:2px}
  .tab.on{background:var(--ink);color:var(--paper-2)}

  /* ---------- DAY NAV ---------- */
  .daynav{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;margin:0 -18px;
    padding-left:18px;padding-right:18px;scrollbar-width:none}
  .daynav::-webkit-scrollbar{display:none}
  .dpill{flex:0 0 auto;background:var(--paper-2);border:1px solid var(--line);
    border-radius:14px;padding:9px 14px;cursor:pointer;min-width:96px;transition:.16s}
  .dpill .dn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--purple-deep)}
  .dpill .dd{font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin-top:1px}
  .dpill .dt{font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.25}
  .dpill.on{background:var(--purple-deep);border-color:var(--purple-deep);color:#fff}
  .dpill.on .dn{color:#D7BBFF}
  .dpill.on .dt{color:#E5D6FF}

  /* ---------- DAY HEADER ---------- */
  .dayhead{margin:14px 0 4px}
  .dayhead .big{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(26px,7vw,38px);
    line-height:1;letter-spacing:-.01em}
  .dayhead .meta{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.06em;
    color:var(--ink-soft);margin-top:7px}

  /* ---------- TIMELINE ---------- */
  .tl{position:relative;margin:18px 0 0;padding-left:26px}
  .tl::before{content:"";position:absolute;left:7px;top:6px;bottom:14px;width:2px;
    background:linear-gradient(var(--line),var(--line) 70%,transparent)}
  .ev{position:relative;margin-bottom:14px}
  .ev::before{content:"";position:absolute;left:-26px;top:7px;width:14px;height:14px;
    border-radius:50%;background:var(--paper);border:3px solid var(--c,#999);z-index:2}
  .card{background:var(--paper-2);border:1px solid var(--line);border-left:4px solid var(--c,#999);
    border-radius:13px;padding:13px 15px;transition:.18s}
  .card.done{opacity:.5}
  .card.done .title{text-decoration:line-through}
  .row1{display:flex;align-items:flex-start;gap:10px}
  .chk{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);
    background:var(--paper);cursor:pointer;margin-top:1px;display:flex;align-items:center;
    justify-content:center;font-size:13px;color:#fff;transition:.15s}
  .chk.on{background:var(--fun);border-color:var(--fun)}
  .evbody{flex:1;min-width:0}
  .time{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.03em;
    color:var(--c,#777);font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .catname{background:var(--c,#777);color:#fff;font-size:9px;padding:2px 7px;border-radius:20px;
    letter-spacing:.08em;text-transform:uppercase}
  .title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;line-height:1.25;
    margin:5px 0 0;letter-spacing:-.005em}
  .title .em{font-style:normal}
  .badge{display:inline-block;font-family:'Space Mono',monospace;font-size:9.5px;
    background:#EFE6F7;color:var(--purple-deep);padding:2px 8px;border-radius:20px;
    margin-left:6px;letter-spacing:.05em;vertical-align:middle}

  /* map + route */
  .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .mbtn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;
    font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.02em;
    padding:7px 11px;border-radius:9px;border:1px solid var(--line);transition:.15s}
  .mbtn:active{transform:scale(.96)}
  .mbtn.g{background:#fff;color:#1a73e8;border-color:#cfd9ec}
  .mbtn.n{background:var(--naver);color:#fff;border-color:var(--naver)}
  .mbtn .pin{font-size:12px}
  .rtoggle{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.02em;
    background:transparent;border:1px dashed var(--line);color:var(--ink-soft);
    padding:7px 11px;border-radius:9px;cursor:pointer}
  .route{display:none;margin-top:10px;font-size:13px;line-height:1.55;color:var(--ink-soft);
    background:var(--paper);border-radius:9px;padding:11px 13px;border:1px solid var(--line)}
  .route.open{display:block}
  .route b{color:var(--ink);font-weight:600}

  /* ---------- CATEGORY VIEW ---------- */
  .filterbar{margin-top:6px}
  .frow{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
  .frow::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;
    letter-spacing:.04em;padding:8px 13px;border-radius:30px;border:1.5px solid var(--ink);
    background:transparent;color:var(--ink);cursor:pointer;transition:.15s;white-space:nowrap}
  .fchip.on{background:var(--ink);color:var(--paper-2)}
  .catsec{margin-top:20px}
  .catsec h3{font-family:'Fraunces',serif;font-weight:900;font-size:23px;margin:0 0 3px;
    display:flex;align-items:center;gap:9px}
  .catsec .cdot{width:11px;height:11px;border-radius:50%;background:var(--c)}
  .catsec .ccount{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-soft);
    letter-spacing:.08em;margin:0 0 13px}
  .place{background:var(--paper-2);border:1px solid var(--line);border-left:4px solid var(--c);
    border-radius:13px;padding:14px 15px;margin-bottom:11px}
  .place .pn{font-family:'Fraunces',serif;font-weight:600;font-size:17.5px;line-height:1.2}
  .place .pcity{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:#fff;background:var(--c);padding:2px 8px;border-radius:20px;
    margin-left:7px;vertical-align:middle}
  .place .addr{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0;font-family:'Space Mono',monospace;
    line-height:1.45}
  .place .desc{font-size:13.5px;color:var(--ink);margin:9px 0 0;line-height:1.6}

  /* ---------- TIPS ---------- */
  .tip{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;
    padding:16px 17px;margin-top:14px}
  .tip h3{font-family:'Fraunces',serif;font-weight:900;font-size:20px;margin:0 0 10px}
  .tip ul{margin:0;padding-left:18px}
  .tip li{margin-bottom:9px;font-size:14px;line-height:1.6}
  .tip li b{color:var(--purple-deep)}
  .phrase{background:var(--ink);color:var(--paper-2);border-radius:14px;padding:16px 17px;margin-top:14px}
  .phrase h3{font-family:'Fraunces',serif;font-weight:900;font-size:20px;margin:0 0 12px;color:#C9A6FF}
  .phrase .p{margin-bottom:12px}
  .phrase .ko{font-family:'Noto Sans KR';font-size:18px;font-weight:700}
  .phrase .rom{font-family:'Space Mono',monospace;font-size:12px;opacity:.8;margin-top:2px}
  .phrase .mean{font-size:13px;margin-top:3px;opacity:.92}

  .hidden{display:none}
  footer{text-align:center;margin-top:34px;font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.1em;color:var(--ink-soft);opacity:.8}
  footer .heart{color:var(--purple)}
  .resetbtn{margin-top:10px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;
    background:none;border:1px solid var(--line);color:var(--ink-soft);padding:6px 12px;
    border-radius:20px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="kicker">BTS ARIRANG 💜 · Itinerary</p>
    <h1>KOREA<br><span class="yr">2026</span></h1>
    <p class="sub">Busan · Gyeongju · Seoul — June 11 → 17</p>
    <div class="facts">
      <span class="fact">📅 7 Days</span>
      <span class="fact">🏙 3 Cities</span>
      <span class="fact">💜 1 Concert</span>
      <span class="fact">✈️ Jeju Air</span>
    </div>
    <div class="count" id="count">
      <div class="lbl" id="countlbl">Departs in</div>
      <div class="clock" id="clock"></div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab on" data-view="day">Day by Day<span class="th">รายวัน</span></button>
    <button class="tab" data-view="cat">By Category<span class="th">หมวดหมู่</span></button>
    <button class="tab" data-view="tips">Tips<span class="th">ทิปส์ &amp; มารยาท</span></button>
  </nav>

  <!-- DAY VIEW -->
  <section id="view-day">
    <div class="daynav" id="daynav"></div>
    <div id="dayhead" class="dayhead"></div>
    <div id="timeline" class="tl"></div>
    <button class="resetbtn" id="resetbtn">↺ Reset all check-offs</button>
  </section>

  <!-- CATEGORY VIEW -->
  <section id="view-cat" class="hidden">
    <div class="filterbar">
      <div class="frow" id="cityrow"></div>
      <div class="frow" id="typerow"></div>
    </div>
    <div id="catlist"></div>
  </section>

  <!-- TIPS VIEW -->
  <section id="view-tips" class="hidden"></section>

  <footer>
    BORAHAE <span class="heart">💜</span> · 7C2552 → ICN<br>
    Made for the trip · v1
  </footer>
</div>

<script>
/* ===================== DATA ===================== */
const G = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const N = q => 'https://map.naver.com/p/search/' + encodeURIComponent(q);

// helper: place object -> {name, g(google url), n(naver url)}
function P(name, opts={}){
  return {
    name,
    g: opts.g || G(opts.q || (name + (opts.city? ', '+opts.city:'') )),
    n: N(opts.nq || opts.q || name)
  };
}

const DAYS = [
  {
    dn:'Day 01', date:'Thu · Jun 11', theme:'Busan → Gyeongju',
    title:'Arrival & Eastward', meta:'BKK ✈ Busan · KTX to Gyeongju',
    events:[
      {t:'12:50 AM – 08:30 AM', cat:'flight', title:'Flight BKK → PUS', badge:'7C2552 · ref XEVNRQ',
        note:'Jeju Air · Gimhae Int’l Airport (PUS) · Direct 5h 40m · Economy.'},
      {t:'09:15 AM – 10:30 AM', cat:'transit', title:'Travel to Haeundae Station (Exit 7)',
        note:'Gimhae Airport station → <b>Sasang Station</b> (3 stops), walk 400 m. Then <b>Line 2 (Green)</b>: Sasang → Haeundae Exit 7 (24 stops).'},
      {t:'11:00 AM – 12:00 PM', cat:'food', title:'Lunch — Rendez-vous / Haeundae Gaya Milmyeon',
        place:P('Haeundae Gaya Milmyeon', {nq:'해운대 가야밀면', q:'Haeundae Gaya Milmyeon Busan'})},
      {t:'02:00 PM – 03:00 PM', cat:'hotel', title:'Check-in — Shilla Stay Busan Haeundae',
        place:P('Shilla Stay Haeundae', {q:'Shilla Stay Haeundae Busan', nq:'신라스테이 해운대'})},
      {t:'03:00 PM – 04:15 PM', cat:'transit', title:'Bus to Busan Station'},
      {t:'04:15 PM – 05:15 PM', cat:'transit', title:'KTX / SRT — Busan → Gyeongju Station', badge:'High-speed rail'},
      {t:'05:15 PM – 06:15 PM', cat:'transit', title:'Gyeongju Station → The K Hotel',
        note:'Arrive Singyeongju (Gyeongju). Suggest <b>Taxi / Uber (UT)</b> to The K Hotel ≈ 25–30 min.'},
      {t:'06:15 PM – 06:30 PM', cat:'hotel', title:'Check-in — The K Hotel Gyeongju',
        place:P('The K Hotel Gyeongju', {q:'The K Hotel Gyeongju', nq:'더케이호텔 경주'})},
    ]
  },
  {
    dn:'Day 02', date:'Fri · Jun 12', theme:'Concert Day 💜',
    title:'BTS ARIRANG', meta:'The main event · Busan Asiad Stadium',
    events:[
      {t:'11:00 AM – 12:00 PM', cat:'hotel', title:'Check-out — The K Hotel Gyeongju'},
      {t:'12:00 PM – 03:00 PM', cat:'transit', title:'Travel to Busan Asiad Main Stadium',
        note:'Taxi to KTX → <b>Busan Station</b>. Subway <b>Line 1</b> → change to <b>Line 3</b> → <b>Sports Complex Station</b> (connects to Asiad Main Stadium).'},
      {t:'03:00 PM – 05:00 PM', cat:'fun', title:'Merch Shop + FESTA zone at the stadium', badge:'Arrive early!'},
      {t:'05:00 PM – 08:00 PM', cat:'concert', title:'BTS ARIRANG Concert 💜', badge:'★ THE moment',
        place:P('Busan Asiad Main Stadium', {q:'Busan Asiad Main Stadium', nq:'부산아시아드주경기장'})},
      {t:'08:00 PM – 09:15 PM', cat:'hotel', title:'Back & Check-in — Shilla Stay Busan Haeundae',
        place:P('Shilla Stay Haeundae', {q:'Shilla Stay Haeundae Busan', nq:'신라스테이 해운대'})},
    ]
  },
  {
    dn:'Day 03', date:'Sat · Jun 13', theme:'Busan Tour',
    title:'Color & Coast', meta:'Gamcheon · Gwangalli · Blueline',
    events:[
      {t:'08:00 AM – 09:00 AM', cat:'landmark', title:'Gamcheon Culture Village',
        place:P('Gamcheon Culture Village', {q:'Gamcheon Culture Village Busan', nq:'감천문화마을'})},
      {t:'10:00 AM – 11:00 AM', cat:'beach', title:'Gwangalli Beach',
        place:P('Gwangalli Beach', {q:'Gwangalli Beach Busan', nq:'광안리해수욕장'})},
      {t:'12:00 PM – 01:00 PM', cat:'food', title:'Lunch — Haeundae Gaya Milmyeon',
        place:P('Haeundae Gaya Milmyeon', {nq:'해운대 가야밀면', q:'Haeundae Gaya Milmyeon Busan'})},
      {t:'01:00 PM – 02:00 PM', cat:'fun', title:'Haeundae Blueline Park beach train 🚂',
        note:'Board the train at <b>Mipo Station</b>.',
        place:P('Haeundae Blueline Park', {q:'Haeundae Blueline Park Mipo', nq:'해운대 블루라인파크 미포정거장'})},
      {t:'02:00 PM – 03:00 PM', cat:'cafe', title:'ZM-ILLENNIAL Cafe (Jimin’s father’s cafe)',
        note:'From Blueline Park, taxi ≈ 25–30 min (Daeyeon-dong). Open daily 10:00–22:00.',
        place:P('ZM-ILLENNIAL', {g:'https://maps.app.goo.gl/61nZrkEKTJ4RZZbo9', nq:'ZM-ILLENNIAL 대연동'})},
      {t:'04:00 PM – 05:00 PM', cat:'landmark', title:'Explore / Rest near Busan Asiad Main Stadium'},
    ]
  },
  {
    dn:'Day 04', date:'Sun · Jun 14', theme:'Hello Seoul & Bagel',
    title:'Fly to Seoul', meta:'PUS ✈ GMP · Bagels & hanok',
    events:[
      {t:'05:00 AM – 06:30 AM', cat:'transit', title:'Check-out & Uber/Limousine to Gimhae Airport'},
      {t:'07:15 AM – 08:20 AM', cat:'flight', title:'Domestic Flight PUS → GMP', badge:'7C904 · ref RGI8WK',
        note:'Jeju Air · Gimpo (GMP) · Direct 1h 05m · Economy.'},
      {t:'09:30 AM – 11:00 AM', cat:'cafe', title:'London Bagel Museum (Anguk) — queue & breakfast 🥯',
        note:'From Gimpo: <b>Line 5 (Purple)</b> → Jongno 3-ga → <b>Line 3 (Orange)</b> → Anguk Station (Exit 2). ≈ 45–50 min.',
        place:P('London Bagel Museum Anguk', {g:'https://maps.app.goo.gl/RkTjtS7vUZvRJYMUA', nq:'런던베이글뮤지엄 안국'})},
      {t:'11:30 AM – 01:00 PM', cat:'landmark', title:'National Museum of Korea',
        place:P('National Museum of Korea', {q:'National Museum of Korea Seoul', nq:'국립중앙박물관'})},
      {t:'01:30 PM – 02:30 PM', cat:'food', title:'Late lunch — Yoojung Sikdang (BTS favorite)',
        note:'From the museum (Ichon): <b>Line 4</b> → Samgakji → <b>Line 6</b> → Yaksu → <b>Line 3</b> → Sinsa / Hakdong. ≈ 35 min.',
        place:P('Yoojung Sikdang', {g:'https://maps.app.goo.gl/EktZoYCa1rtLviy18', nq:'유정식당 신사'})},
      {t:'03:00 PM', cat:'hotel', title:'Check-in — Myeongdong Sunshine Guesthouse',
        place:P('Myeongdong Sunshine Guesthouse', {q:'Myeongdong Sunshine Guesthouse Seoul', nq:'명동 선샤인 게스트하우스'})},
      {t:'04:00 PM – 05:00 PM', cat:'landmark', title:'Stroll Ikseon-dong / Samcheong-dong Hanok Village',
        place:P('Ikseon-dong Hanok Village', {q:'Ikseon-dong Hanok Village Seoul', nq:'익선동 한옥마을'})},
      {t:'05:30 PM onwards', cat:'landmark', title:'Evening walk — Cheonggyecheon Stream',
        place:P('Cheonggyecheon Stream', {q:'Cheonggyecheon Stream Seoul', nq:'청계천'})},
    ]
  },
  {
    dn:'Day 05', date:'Mon · Jun 15', theme:'K-Pop & Cafe',
    title:'HYBE & COEX', meta:'Compose Coffee · Library · Onion',
    events:[
      {t:'10:00 AM – 11:30 AM', cat:'concert', title:'Compose Coffee (V’s brand) + HYBE photo op',
        note:'From Myeongdong: <b>Line 4 (Blue)</b> → Sinyongsan (10 min), walk 10–15 min to the HYBE Building.',
        place:P('HYBE Headquarters', {g:'https://maps.app.goo.gl/n9BQNoRbBoEaoxCv8', nq:'하이브 본사'})},
      {t:'12:30 PM – 02:30 PM', cat:'shop', title:'Starfield COEX Mall & Starfield Library',
        place:P('Starfield Library COEX', {q:'Starfield Library COEX Seoul', nq:'별마당도서관 코엑스'})},

/* ===================== RENDER ===================== */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};

// ---- check-off store ----
let DONE = {};
try{ DONE = JSON.parse(localStorage.getItem('korea2026_done')||'{}'); }catch(e){ DONE={}; }
function saveDone(){ try{ localStorage.setItem('korea2026_done', JSON.stringify(DONE)); }catch(e){} }

function mapButtons(place){
  const w = el('div','acts');
  const g = el('a','mbtn g','<span class="pin">📍</span> Google');
  g.href = place.g; g.target='_blank'; g.rel='noopener';
  const n = el('a','mbtn n','<b style="font-weight:700">N</b> Naver');
  n.href = place.n; n.target='_blank'; n.rel='noopener';
  w.appendChild(g); w.appendChild(n);
  return w;
}

let curDay = 0;
function renderDayNav(){
  const nav = $('#daynav'); nav.innerHTML='';
  DAYS.forEach((d,i)=>{
    const p = el('div','dpill'+(i===curDay?' on':''));
    p.innerHTML = `<div class="dn">${d.dn}</div><div class="dd">${d.date}</div><div class="dt">${d.theme}</div>`;
    p.onclick = ()=>{ curDay=i; renderDayNav(); renderDay(); 
      $('#timeline').scrollIntoView({behavior:'smooth',block:'start'}); };
    nav.appendChild(p);
  });
}

function renderDay(){
  const d = DAYS[curDay];
  $('#dayhead').innerHTML =
    `<div class="big">${d.title}</div><div class="meta">${d.dn} · ${d.date} — ${d.meta}</div>`;
  const tl = $('#timeline'); tl.innerHTML='';
  d.events.forEach((ev,j)=>{
    const c = `var(--${ev.cat})`;
    const id = `${curDay}-${j}`;
    const isDone = !!DONE[id];
    const wrap = el('div','ev'); wrap.style.setProperty('--c',c);

    const card = el('div','card'+(isDone?' done':'')); card.style.setProperty('--c',c);
    const row1 = el('div','row1');
    const chk = el('div','chk'+(isDone?' on':''), isDone?'✓':'');
    chk.onclick = ()=>{ DONE[id]=!DONE[id]; if(!DONE[id])delete DONE[id]; saveDone(); renderDay(); };
    const body = el('div','evbody');
    const cat = CATS[ev.cat];
    body.appendChild(el('div','time',
      `${ev.t} <span class="catname">${cat.i} ${cat.n}</span>`));
    body.appendChild(el('div','title',
      `${ev.title}${ev.badge?` <span class="badge">${ev.badge}</span>`:''}`));

    if(ev.note){
      const tgl = el('button','rtoggle','🚇 Route ▾');
      const rt = el('div','route', ev.note);
      tgl.onclick = ()=>{ rt.classList.toggle('open');
        tgl.innerHTML = rt.classList.contains('open')?'🚇 Route ▴':'🚇 Route ▾'; };
      // if it's a real place, route + maps share the acts row; render route under
      if(ev.place){ body.appendChild(mapButtons(ev.place)); }
      const tgRow = el('div','acts'); tgRow.appendChild(tgl);
      body.appendChild(tgRow); body.appendChild(rt);
    } else if(ev.place){
      body.appendChild(mapButtons(ev.place));
    }

    row1.appendChild(chk); row1.appendChild(body);
    card.appendChild(row1); wrap.appendChild(card); tl.appendChild(wrap);
  });
}

// ---------- CATEGORY VIEW ----------
const TYPE_ORDER = ['All','Cafe','Restaurant','Beauty','Shopping','Landmark'];
const TYPE_CAT = {Cafe:'cafe', Restaurant:'food', Beauty:'beauty', Shopping:'shop', Landmark:'landmark'};
const TYPE_ICON = {Cafe:'☕', Restaurant:'🍽', Beauty:'💆', Shopping:'🛍', Landmark:'📍'};
let curCity='All', curType='All';

function renderFilters(){
  const cities=['All','Busan','Seoul'];
  const cr=$('#cityrow'); cr.innerHTML='';
  cities.forEach(c=>{
    const b=el('button','fchip'+(c===curCity?' on':''), (c==='All'?'🌏 ':'')+c);
    b.onclick=()=>{curCity=c; renderFilters(); renderCat();}; cr.appendChild(b);
  });
  const tr=$('#typerow'); tr.innerHTML='';
  TYPE_ORDER.forEach(t=>{
    const ic = t==='All'?'✦':TYPE_ICON[t];
    const b=el('button','fchip'+(t===curType?' on':''), `${ic} ${t}`);
    b.onclick=()=>{curType=t; renderFilters(); renderCat();}; tr.appendChild(b);
  });
}

function renderCat(){
  const list=$('#catlist'); list.innerHTML='';
  let data=PLACES.filter(p=>(curCity==='All'||p.city===curCity)&&(curType==='All'||p.type===curType));
  const groups={};
  data.forEach(p=>{ (groups[p.type]=groups[p.type]||[]).push(p); });
  const order = curType==='All'?['Cafe','Restaurant','Beauty','Shopping','Landmark']:[curType];
  order.forEach(type=>{
    if(!groups[type]) return;
    const cvar=`var(--${TYPE_CAT[type]})`;
    const sec=el('div','catsec'); sec.style.setProperty('--c',cvar);
    sec.appendChild(el('h3',null,`<span class="cdot"></span>${TYPE_ICON[type]} ${type}`));
    sec.appendChild(el('p','ccount',`${groups[type].length} places`));
    groups[type].forEach(p=>{
      const card=el('div','place'); card.style.setProperty('--c',cvar);
      card.appendChild(el('div',null,
        `<span class="pn">${p.name}</span><span class="pcity">${p.city}</span>`));
      if(p.addr) card.appendChild(el('div','addr','📮 '+p.addr));
      if(p.desc) card.appendChild(el('div','desc',p.desc));
      card.appendChild(mapButtons({g:p.g||G(p.name+', '+p.city), n:N(p.nq||p.name)}));
      sec.appendChild(card);
    });
    list.appendChild(sec);
  });
  if(!data.length) list.appendChild(el('p','ccount','No places for this filter.'));
}

  const ph=el('div','phrase'); ph.innerHTML=`<h3>💬 ประโยคเกาหลีที่ได้ใช้แน่</h3>
    <div class="p"><div class="ko">1인 1메뉴입니까?</div><div class="rom">il-in il-menyu im-ni-kka?</div><div class="mean">ต้องสั่ง 1 คน 1 เมนูไหมคะ/ครับ?</div></div>
    <div class="p"><div class="ko">저기요</div><div class="rom">jeo-gi-yo</div><div class="mean">ขอโทษนะคะ/ครับ (ใช้เรียกพนักงาน)</div></div>
    <div class="p"><div class="ko">계산해 주세요</div><div class="rom">gye-san-hae ju-se-yo</div><div class="mean">คิดเงินด้วยค่ะ/ครับ (พูดตอนเดินไปเคาน์เตอร์)</div></div>`;
  v.appendChild(cafe); v.appendChild(rest); v.appendChild(ph);
}

// ---------- TABS ----------
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    const v=t.dataset.view;
    $('#view-day').classList.toggle('hidden', v!=='day');
    $('#view-cat').classList.toggle('hidden', v!=='cat');
    $('#view-tips').classList.toggle('hidden', v!=='tips');
    window.scrollTo({top:0,behavior:'smooth'});
  };
});

$('#resetbtn').onclick=()=>{ if(confirm('Reset all check-offs?')){ DONE={}; saveDone(); renderDay(); } };

// ---------- COUNTDOWN ----------
const TARGET = new Date('2026-06-11T00:50:00+07:00').getTime();
function tick(){
  const now=Date.now(); let diff=TARGET-now;
  const c=$('#count'), clk=$('#clock'), lbl=$('#countlbl');
  if(diff<=0){ c.classList.add('go'); lbl.textContent='Annyeong! Trip is on 💜';
    clk.innerHTML=`<div class="u"><div class="n">GO</div><div class="t">Enjoy</div></div>`; return; }
  const d=Math.floor(diff/864e5); diff-=d*864e5;
  const h=Math.floor(diff/36e5); diff-=h*36e5;
  const m=Math.floor(diff/6e4); diff-=m*6e4;
  const s=Math.floor(diff/1e3);
  const u=(n,t)=>`<div class="u"><div class="n">${String(n).padStart(2,'0')}</div><div class="t">${t}</div></div>`;
  clk.innerHTML=u(d,'Days')+u(h,'Hrs')+u(m,'Min')+u(s,'Sec');
}
tick(); setInterval(tick,1000);

// init
renderDayNav(); renderDay(); renderFilters(); renderCat(); renderTips();
</script>
